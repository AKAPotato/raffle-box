<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>随机抽取生成器 · Material Design 3</title>
<style>
/* ============ Material Design 3 tokens ============ */
:root{
  --font: "Roboto", "Google Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, sans-serif;
  --r-xs: 4px; --r-sm: 8px; --r-md: 12px; --r-lg: 16px; --r-xl: 28px; --r-full: 999px;
  --sp: 16px;
  --ease: cubic-bezier(.2,0,0,1);
  --ease-dec: cubic-bezier(.05,.7,.1,1);   /* MD3 emphasized decelerate：起步快、末端缓停 */
  --ease-out-cubic: cubic-bezier(.215,.61,.355,1);   /* 长尾缓停，用于揭晓上移 */
  --ease-soft: cubic-bezier(.32,.72,0,1);
  --dur: 220ms;
}
html[data-theme="dark"]{
  color-scheme:dark;   /* 让原生控件（下拉选项/滚动条/日期）跟随深色 */
  /* 哔哩哔哩蓝（#00AEEC）为基准的 MD3 深色配色；B站粉 #FB7299 作 tertiary 强调色 */
  --primary:#00AEEC; --on-primary:#00344c; --primary-cont:#004b6b; --on-primary-cont:#c5e9fb;
  --secondary:#b3c9d6; --on-secondary:#1d333f; --secondary-cont:#334a56; --on-secondary-cont:#cfe3ee;
  --tertiary:#ffb0c8; --on-tertiary:#680038; --tertiary-cont:#8d1f4c; --on-tertiary-cont:#ffd8e4;
  --surface:#10161a; --surface-dim:#10161a; --surface-bright:#39444c;
  --s-c-lowest:#0b1114; --s-c-low:#181f24; --s-c:#1c242a; --s-c-high:#262f36; --s-c-highest:#313b43;
  --on-surface:#e1e6ea; --on-surf-var:#c2ccd4;
  --outline:#8d99a3; --outline-var:#414d57;
  --error:#f2b8b5; --on-error:#601410; --error-cont:#8c1d18; --on-error-cont:#f9dedc;
  --success:#a8d5a2; --success-cont:#29432b;
  --scrim:rgba(0,0,0,.6);
  --sh-1:0 1px 3px rgba(0,0,0,.5), 0 1px 2px rgba(0,0,0,.3);
  --sh-2:0 2px 6px rgba(0,0,0,.5), 0 1px 3px rgba(0,0,0,.35);
  --sh-3:0 6px 18px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
  --gold:#f5c96b;
}
html[data-theme="light"]{
  color-scheme:light;
  /* primary 直接使用 B站官方标志蓝 #00AEEC；按钮文字用深蓝保证可读性 */
  --primary:#00AEEC; --on-primary:#00344c; --primary-cont:#c6e9fb; --on-primary-cont:#001f2c;
  --secondary:#4c6472; --on-secondary:#fff; --secondary-cont:#d1e3ee; --on-secondary-cont:#0e1f27;
  --tertiary:#a5376b; --on-tertiary:#fff; --tertiary-cont:#ffd8e4; --on-tertiary-cont:#3f0020;
  --surface:#fafcfe; --surface-dim:#dbe2e8; --surface-bright:#fafcfe;
  --s-c-lowest:#fff; --s-c-low:#f4f8fa; --s-c:#eaf0f4; --s-c-high:#e4eaef; --s-c-highest:#dee5ea;
  --on-surface:#171f24; --on-surf-var:#5b6b75;
  --outline:#6f7b85; --outline-var:#c0cad2;
  --error:#b3261e; --on-error:#fff; --error-cont:#f9dedc; --on-error-cont:#410e0b;
  --success:#2e7d32; --success-cont:#d7f0d5;
  --scrim:rgba(0,0,0,.4);
  --sh-1:0 1px 2px rgba(0,0,0,.18), 0 1px 3px 1px rgba(0,0,0,.08);
  --sh-2:0 1px 2px rgba(0,0,0,.2), 0 2px 6px 2px rgba(0,0,0,.1);
  --sh-3:0 4px 8px rgba(0,0,0,.18), 0 8px 24px 4px rgba(0,0,0,.1);
  --gold:#b8860b;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;overflow-anchor:none;}  /* 双保险：根滚动容器也禁用锚定 */
body{
  font-family:var(--font); background:var(--surface); color:var(--on-surface);
  -webkit-font-smoothing:antialiased; font-size:14px; line-height:1.5;
  min-height:100vh;
  overflow-anchor:none;   /* 关闭滚动锚定：结果卡片因长用户名换行变高时，页面不再被浏览器"回拉"导致「抽取结果」栏突然上移 */
}
::selection{background:var(--primary-cont); color:var(--on-primary-cont);}
h1,h2,h3,p{margin:0;}
.spacer{flex:1;}
button{font-family:inherit;}

/* ============ App bar ============ */
.appbar{
  position:sticky; top:0; z-index:20; background:var(--surface);
  border-bottom:1px solid var(--outline-var);
  transition:box-shadow var(--dur) var(--ease);
}
.appbar.scrolled{box-shadow:var(--sh-2);}
.appbar-inner{
  max-width:1360px; margin:0 auto; padding:10px 20px;
  display:flex; align-items:center; gap:16px; min-height:64px;
}
.brand{display:flex; align-items:center; gap:14px;}
.brand-logo{
  width:40px; height:40px; border-radius:var(--r-md); display:grid; place-items:center;
  background:var(--primary-cont); color:var(--on-primary-cont); flex:none;
}
.brand h1{font-size:20px; font-weight:500; letter-spacing:.1px;}
.brand p{font-size:12px; color:var(--on-surf-var); letter-spacing:.4px;}

/* ============ Buttons ============ */
.icon-btn{
  width:40px;height:40px;border:0;border-radius:var(--r-full);background:transparent;
  color:var(--on-surf-var); display:grid;place-items:center; cursor:pointer; position:relative;
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.icon-btn:hover{background:color-mix(in srgb, var(--on-surface) 8%, transparent); color:var(--on-surface);}
.icon-btn svg{width:22px;height:22px;fill:currentColor;}
.btn{
  border:0; border-radius:var(--r-full); padding:10px 24px; font-size:14px; font-weight:500;
  letter-spacing:.1px; cursor:pointer; position:relative; overflow:hidden;
  display:inline-flex; align-items:center; gap:8px; justify-content:center;
  transition:box-shadow var(--dur) var(--ease), background var(--dur) var(--ease), transform 120ms var(--ease);
}
.btn:active{transform:scale(.97);}
.btn svg{width:18px;height:18px;fill:currentColor;}
.btn-filled{background:var(--primary); color:var(--on-primary);}
.btn-filled:hover{box-shadow:var(--sh-1);}
.btn-tonal{background:var(--secondary-cont); color:var(--on-secondary-cont);}
.btn-tonal:hover{box-shadow:var(--sh-1);}
.btn-outlined{background:transparent; color:var(--primary); box-shadow:inset 0 0 0 1px var(--outline);}
.btn-outlined:hover{background:color-mix(in srgb, var(--primary) 8%, transparent);}
.btn-text{background:transparent; color:var(--primary); padding:10px 12px;}
.btn-text:hover{background:color-mix(in srgb, var(--primary) 8%, transparent);}
.btn-text svg{width:16px;height:16px;}
.btn:disabled{opacity:.38; cursor:not-allowed; box-shadow:none; transform:none;}

/* ============ Layout ============ */
.layout{
  max-width:1360px; margin:0 auto; padding:20px; display:grid; gap:20px;
  grid-template-columns:minmax(340px, 420px) 1fr; align-items:start;
}
@media (max-width:1080px){ .layout{grid-template-columns:1fr;} }

.panel{
  background:var(--s-c-low); border-radius:var(--r-md); padding:20px;
  box-shadow:var(--sh-1); border:1px solid var(--outline-var);
}
.panel + .panel{margin-top:0;}
.panel-head{display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap;}
.panel-head h2{font-size:16px; font-weight:500; letter-spacing:.2px;}
.panel-head .sub{font-size:12px; color:var(--on-surf-var);}

/* ============ Chips ============ */
.chips{display:flex; flex-wrap:wrap; gap:8px;}
.chip{
  border:1px solid var(--outline); background:transparent; color:var(--on-surf-var);
  border-radius:var(--r-sm); padding:8px 14px; font-size:13px; font-weight:500; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px;
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.chip svg{width:18px;height:18px;fill:currentColor;}
.chip:hover{background:color-mix(in srgb, var(--on-surface) 8%, transparent);}
.chip[aria-selected="true"]{
  background:var(--secondary-cont); color:var(--on-secondary-cont); border-color:transparent;
}
.chip-static{
  border-radius:var(--r-sm); padding:4px 10px; font-size:12px; font-weight:500;
  background:var(--s-c-high); color:var(--on-surf-var); white-space:nowrap;
}

/* ============ Fields ============ */
.tpl-desc{font-size:12.5px; color:var(--on-surf-var); margin:12px 0 16px; line-height:1.6;}
.fields{display:grid; gap:14px;}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:520px){ .row2{grid-template-columns:1fr;} }
.field{display:flex; flex-direction:column; gap:6px;}
.field > label{font-size:12px; font-weight:500; color:var(--on-surf-var); letter-spacing:.4px;}
.tf{
  position:relative; background:var(--s-c-highest); border-radius:var(--r-xs);
  border-bottom:2px solid var(--on-surf-var); transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.tf:focus-within{border-bottom-color:var(--primary); background:var(--s-c-high);}
.tf input, .tf select, .tf textarea{
  width:100%; background:transparent; border:0; outline:0; color:var(--on-surface);
  font-family:inherit; font-size:14px; padding:14px 12px 12px; border-radius:var(--r-xs) var(--r-xs) 0 0;
}
.tf textarea{resize:vertical; min-height:110px; line-height:1.7; font-size:13px;}
.tf select{cursor:pointer; appearance:none; padding-right:32px;}
/* 原生下拉弹层跟随主题（color-scheme 之外再显式兜底，避免深色模式下选项白底） */
.tf select option{background:var(--s-c-high); color:var(--on-surface);}
.tf select optgroup{background:var(--s-c-low); color:var(--on-surface);}
.tf::after{
  content:""; position:absolute; right:12px; top:20px; width:0; height:0; pointer-events:none;
  border-left:5px solid transparent; border-right:5px solid transparent; border-top:6px solid var(--on-surf-var);
}
.tf.no-caret::after{display:none;}
.tf.error{border-bottom-color:var(--error);}
.hint{font-size:11.5px; color:var(--on-surf-var); padding:0 12px 6px;}
.err{font-size:11.5px; color:var(--error); padding:0 12px 6px; display:none;}
.tf.error ~ .err{display:block;}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
input[type=number]{-moz-appearance:textfield;}

.switch-row{
  display:flex; align-items:center; gap:12px; padding:6px 2px; cursor:pointer; user-select:none;
}
.switch-row .txt{font-size:13.5px; display:block;}
.switch-row .desc{font-size:11.5px; color:var(--on-surf-var); display:block;}

/* 模板/面板切换的淡入淡出 */
.fade{transition:opacity 200ms var(--ease), transform 200ms var(--ease);}
.fade.out{opacity:0; transform:translateY(10px); pointer-events:none;}

/* 滚动中状态：直接显示在面板头部的计数 chip 上（不新增行 → 零布局变化，停止时不会重排掉帧）
   曾在结果区上方放浮动提示条，但它是 grid 行高动画，每帧重排整个结果区，
   正好在「按停止」时启动，与仍在滚动的数字抢主线程 —— 已改为 chip 文案承载 */
.chip-static.rolling{
  background:var(--primary-cont); color:var(--on-primary-cont);
  transition:background 200ms var(--ease), color 200ms var(--ease);
}
.chip-static .dots::after{content:''; animation:dots 1.2s steps(1) infinite;}
@keyframes dots{0%{content:'';} 25%{content:'.';} 50%{content:'..';} 75%{content:'...';}}
.fab-ext:disabled{opacity:.45; cursor:not-allowed; box-shadow:none; transform:none;}
/* 抽取按钮在滚动时切换为停止态 */
.fab-ext.stop{background:var(--tertiary-cont); color:var(--on-tertiary-cont); animation:pulse 1.5s ease-in-out infinite;}
@keyframes pulse{
  0%,100%{box-shadow:var(--sh-1);}
  50%{box-shadow:0 0 0 7px color-mix(in srgb, var(--tertiary) 20%, transparent), var(--sh-1);}
}
.switch{position:relative; flex:none; width:52px; height:32px;}
.switch input{position:absolute; opacity:0; width:100%; height:100%; margin:0; cursor:pointer;}
.switch .track{
  position:absolute; inset:0; border-radius:var(--r-full); background:var(--surface-bright);
  border:2px solid var(--outline); transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease);
  pointer-events:none;
}
.switch .thumb{
  position:absolute; top:4px; left:4px; width:24px; height:24px; border-radius:var(--r-full);
  background:var(--outline);
  border:2px solid transparent;              /* 预留描边位，关闭时透明 */
  transform:translateX(0) scale(.667);       /* 关闭态 16px，用 transform 避免半像素抖动 */
  will-change:transform;
  transition:transform var(--dur) var(--ease), background var(--dur) var(--ease),
             border-color var(--dur) var(--ease);
  pointer-events:none;
}
/* 开启态：描边沿用与关闭态一致的 outline 深色，保证在填充色上依然清晰 */
.switch input:checked ~ .track{
  background:var(--primary);
  border-color:var(--outline);
}
.switch input:checked ~ .thumb{
  transform:translateX(20px) scale(1);       /* 24..48，右侧留 4px，不再顶穿滑轨 */
  background:var(--on-primary);
  border-color:var(--outline);
}
.switch input:focus-visible ~ .track{
  box-shadow:0 0 0 3px color-mix(in srgb, var(--primary) 45%, transparent);
}

.drop{
  border:1.5px dashed var(--outline); border-radius:var(--r-md); padding:22px 16px; text-align:center;
  cursor:pointer; transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease);
  background:var(--s-c-lowest);
}
.drop:hover, .drop.over{background:var(--secondary-cont); border-color:var(--secondary);}
.drop svg{width:28px;height:28px;fill:var(--on-surf-var); margin-bottom:8px;}
.drop b{display:block; font-weight:500; font-size:13.5px;}
.drop span{font-size:12px; color:var(--on-surf-var);}

/* ============ Result stage ============ */
.stage{display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(160px,1fr));}
.stage.single{grid-template-columns:minmax(0,340px);}
.empty{
  grid-column:1/-1; text-align:center; padding:56px 20px; color:var(--on-surf-var);
  border:1px dashed var(--outline-var); border-radius:var(--r-md);
}
.empty svg{width:44px;height:44px;fill:var(--outline); margin-bottom:10px;}
.empty b{display:block; font-weight:500; color:var(--on-surface); margin-bottom:4px; font-size:15px;}

.rcard{
  position:relative; background:var(--s-c-high); border-radius:var(--r-md); padding:16px 16px 14px;
  border:1px solid var(--outline-var); overflow:hidden;
  animation:pop 340ms var(--ease) both;
  contain:layout paint;                /* 限制布局/绘制影响范围，揭晓时的重排不再波及整页 */
}
/* 滚动阶段就提前建立合成层，避免定格瞬间临时提层 + 重新栅格化造成的一帧卡顿 */
.rcard.rolling, .rcard.settled{will-change:transform;}
.rcard.win{
  background:linear-gradient(150deg, var(--primary-cont), var(--s-c-high) 130%);
  border-color:var(--primary); box-shadow:var(--sh-2);
}
.rcard .idx{
  position:absolute; top:10px; right:12px; font-size:11px; font-weight:500;
  color:var(--on-surf-var); letter-spacing:.5px;
}
.rcard.win .idx{color:var(--on-primary-cont);}
/* 奖品名：卡片左上角的 chip，滚动期间也常驻（奖品是事先定好的，不算剧透） */
.rcard .prize{
  display:inline-block; margin-bottom:6px; padding:3px 10px;
  max-width:calc(100% - 40px);            /* 给右上角 #序号 让位，避免重叠 */
  font-size:11.5px; font-weight:500; line-height:1.4; border-radius:999px;
  background:var(--tertiary-cont); color:var(--on-tertiary-cont);
  border:1px solid var(--outline-var); word-break:break-all;
}
.rcard.win .prize{
  background:rgba(255,255,255,.22); color:var(--on-primary-cont); border-color:rgba(255,255,255,.38);
}
.rcard .main{
  font-size:26px; font-weight:500; letter-spacing:.5px; line-height:1.25; word-break:break-all;
  padding-right:28px; font-variant-numeric:tabular-nums;
}
.rcard.win .main{color:var(--on-primary-cont); font-weight:600;}
.rcard .sub{
  font-size:12px; color:var(--on-surf-var); margin-top:6px;
  min-height:17px;                       /* 预留一行，避免文案出现/消失时撑大卡片与外框 */
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;   /* 恒为一行，定格时不会换行撑高 */
  transition:opacity 240ms var(--ease);
}
.rcard.rolling .sub{animation:softBlink 1.1s ease-in-out infinite;}
@keyframes softBlink{0%,100%{opacity:.45;} 50%{opacity:1;}}
/* 文本交叉过渡：旧值上移淡出、新值同时上移淡入（两层叠放，中间不会出现空白 → 不闪） */
.rcard .main, .rcard .sub{display:grid; grid-template-columns:minmax(0,1fr);}
.rcard .mv{grid-area:1/1; min-width:0;}
.rcard .sub .mv{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.rcard .mv.out{animation:mvOut 360ms var(--ease-out-cubic) both;}
.rcard .mv.in{animation:mvIn 420ms var(--ease-out-cubic) both;}
/* 位移收小（8px）：卡片自身在做 900ms cardRise，数字位移过大会与卡片位移叠加，
   相对屏幕几乎不动，观感像「卡住」；数字宜快速落定，让卡片继续缓移 */
@keyframes mvOut{
  0%  {opacity:1; transform:none;}
  100%{opacity:0; transform:translateY(-10px);}
}
@keyframes mvIn{
  0%  {opacity:0; transform:translateY(8px);}
  40% {opacity:1;}                    /* 早早可见，避免「闪现」感 */
  100%{opacity:1; transform:none;}
}
.rcard.win .sub{color:color-mix(in srgb, var(--on-primary-cont) 78%, transparent);}
/* 详细信息：用 0fr → 1fr 的网格行做上下展开，卡片与外框高度随之平滑变化，不再瞬间跳变 */
.rcard .meta-wrap{
  display:grid; grid-template-rows:0fr; opacity:0;
  transition:grid-template-rows 380ms var(--ease), opacity 300ms var(--ease);
}
/* 展开延后 220ms：让揭晓启动帧不做布局（行高动画每帧重排），等卡片上移稳定后再展开 */
.rcard.settled .meta-wrap{grid-template-rows:1fr; opacity:1; transition-delay:220ms;}
.rcard .meta{overflow:hidden; min-height:0;}
.rcard .meta .mi{
  margin-top:10px; padding-top:8px; border-top:1px solid var(--outline-var);
  font-size:11.5px; color:var(--on-surf-var); word-break:break-all; line-height:1.6;
}
.rcard.rolling .main{animation:flick 90ms steps(2) infinite; opacity:.85;}
/* 长用户名换行会让卡片高度在 1行/2行 间抖动（带动整行结果卡上下跳）：
   带副标题的卡（B站评论抽奖）主名固定预留两行高度，全程高度稳定 */
.rcard:has(.sub) .main{min-height:2.5em;}
/* 揭晓时整个结果框缓动上移（文本层交叉过渡 + 框体上移，强化「浮现」感）
   900ms + easeOutCubic：起步不急、长尾缓停，避免「一下就窜上去」 */
.rcard.settled{animation:cardRise 900ms var(--ease-out-cubic); will-change:transform;}
@keyframes cardRise{
  0%  {transform:translateY(16px);}
  100%{transform:translateY(0);}
}
/* 定格瞬间整卡一层柔和扫光 */
.rcard.settled::after{
  content:''; position:absolute; inset:0; background:var(--primary); opacity:0;
  pointer-events:none; animation:sweep 760ms var(--ease-out-cubic);
}
@keyframes sweep{0%{opacity:.20;} 100%{opacity:0;}}
@keyframes pop{from{opacity:0; transform:translateY(12px) scale(.96);} to{opacity:1; transform:none;}}
@keyframes flick{0%{opacity:.85;} 100%{opacity:1;}}
/* 尊重系统「减少动态效果」：直接切换到结果，不做位移与模糊 */
@media (prefers-reduced-motion: reduce){
  .rcard .mv.out, .rcard .mv.in{animation-duration:1ms;}
  .rcard.rolling .main{animation:none;}
}

.gcard{grid-column:1/-1; background:var(--s-c-lowest); border-radius:var(--r-md); padding:14px 16px; border:1px solid var(--outline-var); animation:pop 340ms var(--ease) both;}
.gcard h3{font-size:14px; font-weight:500; margin-bottom:10px; color:var(--primary);}
.gcard .members{display:flex; flex-wrap:wrap; gap:6px;}
.gcard .m{background:var(--secondary-cont); color:var(--on-secondary-cont); border-radius:var(--r-sm); padding:5px 10px; font-size:12.5px;}
.gcard .m.dim{opacity:.55; background:transparent; border:1px dashed var(--outline-var); color:var(--on-surface-var);}
/* 扫码登录面板：二维码必须白底黑块，深色主题下也不能反色 */
.qrbox{margin-top:12px; display:flex; flex-direction:column; align-items:flex-start; gap:10px; padding:14px; border:1px solid var(--outline-var); border-radius:var(--r-md); background:var(--s-c-lowest);}
.qrimg{background:#fff; border-radius:var(--r-sm); padding:8px; line-height:0;}
.qrimg svg{display:block; width:260px; height:260px;}
.qrtip{font-size:13px; color:var(--on-surface-var); line-height:1.6;}
.qrwarn{margin-top:4px; font-size:12px; opacity:.75;}
.qrhint{font-size:13px; line-height:1.8; color:var(--on-surface-var);}
.qrhint.ok{color:var(--primary); font-weight:500;}
.qrhint code{background:var(--secondary-cont); color:var(--on-secondary-cont); padding:2px 6px; border-radius:4px; font-size:12.5px;}
.gcard.rolling .members{animation:softBlink 1.1s ease-in-out infinite;}
.gcard.settled{animation:cardRise 900ms var(--ease-out-cubic); will-change:transform;}

/* ============ Seat map ============ */
.seat-wrap{margin-top:18px; display:none;}
.seat-wrap.show{display:block;}
.seat-legend{display:flex; gap:14px; flex-wrap:wrap; font-size:11.5px; color:var(--on-surf-var); margin-bottom:10px;}
.seat-legend i{display:inline-block; width:12px;height:12px;border-radius:3px; vertical-align:-2px; margin-right:5px;}
/* 图例色块上画一条删除斜线，和座位图的删除线对应 */
.seat-legend .i-drawn{
  background:var(--tertiary-cont); border:1px solid var(--tertiary);
  background-image:linear-gradient(to top left, transparent 43%, var(--on-tertiary-cont) 43%, var(--on-tertiary-cont) 57%, transparent 57%);
}
.seatmap{display:grid; gap:6px; overflow-x:auto; padding-bottom:6px;}
.seat-row{display:flex; align-items:center; gap:6px;}
.seat-row .rl{width:38px; flex:none; font-size:11.5px; color:var(--on-surf-var); text-align:right;}
.seat{
  width:26px;height:26px; flex:none; border-radius:6px; font-size:10.5px; display:grid; place-items:center;
  background:var(--s-c-highest); color:var(--on-surf-var); border:1px solid transparent;
}
/* 历史已抽：用 tertiary 容器色（与主色的「本次中奖」明确区分）+ 描边 + 贯穿整格的删除线 */
.seat.drawn{
  background:var(--tertiary-cont); color:var(--on-tertiary-cont);
  border:1px solid var(--tertiary); font-weight:600;
  position:relative;
}
/* 不用 text-decoration（只压着数字、很短），改用横贯整格的线段 */
.seat.drawn::after{
  content:''; position:absolute; left:2px; right:2px; top:50%;
  height:1.6px; margin-top:-.8px; border-radius:1px;
  background:currentColor; opacity:.85;
}
.seat.win{
  background:var(--primary); color:var(--on-primary); font-weight:700;
  border:1px solid var(--primary);
  transform:scale(1.12); box-shadow:var(--sh-1); animation:seatPop 420ms var(--ease);
}
@keyframes seatPop{0%{transform:scale(.6);} 60%{transform:scale(1.22);} 100%{transform:scale(1.12);}}
.screen{
  height:8px; border-radius:var(--r-full); margin:0 0 14px 44px;
  background:linear-gradient(90deg, transparent, var(--outline), transparent);
}

/* ============ History ============ */
.hist-wrap{max-width:1360px; margin:0 auto; padding:0 20px 32px;}
.hist{display:grid; gap:8px;}
.hist-item{
  display:flex; align-items:center; gap:12px; padding:10px 14px; border-radius:var(--r-sm);
  background:var(--s-c-lowest); border:1px solid var(--outline-var); font-size:13px;
}
.hist-item .t{font-size:11.5px; color:var(--on-surf-var); flex:none; font-variant-numeric:tabular-nums;}
.hist-item .n{flex:none; font-weight:500; color:var(--primary); min-width:104px;}
.hist-item .v{color:var(--on-surf-var); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.hist-empty{font-size:13px; color:var(--on-surf-var); padding:6px 2px;}

/* ============ 礼花 ============ */
#confetti{position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:80;}

/* ============ B 站评论抽奖面板 ============ */
.bili-tip{font-size:11.5px; color:var(--on-surf-var);}
.bili-tip.err{color:var(--tertiary);}
.bili-meta{
  background:var(--s-c-lowest); border:1px solid var(--outline-var); border-radius:var(--r-md);
  padding:10px 12px; margin-bottom:14px;
}
.bili-meta .t{font-size:13px; font-weight:500; margin-bottom:4px; word-break:break-all;}
.bili-meta .d{font-size:11.5px; color:var(--on-surf-var);}
.bili-adv{margin-top:14px; border-top:1px solid var(--outline-var); padding-top:10px;}
.bili-adv summary{
  font-size:12px; color:var(--on-surf-var); cursor:pointer; list-style:none;
  display:flex; align-items:center; gap:6px; user-select:none;
}
.bili-adv summary::before{content:'▸'; font-size:10px; transition:transform 160ms var(--ease);}
.bili-adv[open] summary::before{transform:rotate(90deg);}
.bili-adv summary::-webkit-details-marker{display:none;}
.meta .mi .lnk{color:var(--primary); text-decoration:underline; word-break:break-all;}

/* ============ Snackbar ============ */
.snackbar{
  position:fixed; left:50%; bottom:24px; transform:translate(-50%, 140%); z-index:60;
  background:var(--on-surface); color:var(--surface); padding:14px 16px; border-radius:var(--r-sm);
  box-shadow:var(--sh-3); font-size:13.5px; max-width:min(560px, calc(100vw - 32px));
  display:flex; align-items:center; gap:16px; transition:transform 300ms var(--ease);
}
.snackbar.show{transform:translate(-50%,0);}
.snackbar b{font-weight:600; color:var(--primary); cursor:pointer; flex:none;}

/* ============ Table preview ============ */
.tbl-wrap{overflow:auto; border:1px solid var(--outline-var); border-radius:var(--r-sm); max-height:190px; background:var(--s-c-lowest);}
table{border-collapse:collapse; width:100%; font-size:12px;}
th,td{padding:7px 10px; text-align:left; white-space:nowrap; border-bottom:1px solid var(--outline-var);}
th{position:sticky; top:0; background:var(--s-c-high); font-weight:500; color:var(--on-surf-var); z-index:1;}
tr:last-child td{border-bottom:0;}
.map-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px;}
.badge{display:inline-flex; align-items:center; gap:4px; font-size:11.5px; padding:2px 8px; border-radius:var(--r-full); background:var(--success-cont); color:var(--success);}
.actions{display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; align-items:center;}
.fab-ext{
  border:0; border-radius:var(--r-lg); padding:16px 22px; font-size:14px; font-weight:600;
  background:var(--primary); color:var(--on-primary); cursor:pointer; flex:1;
  display:inline-flex; align-items:center; justify-content:center; gap:10px; box-shadow:var(--sh-1);
  transition:box-shadow var(--dur) var(--ease), transform 120ms var(--ease);
}
.fab-ext:hover{box-shadow:var(--sh-2);}
.fab-ext:active{transform:scale(.98);}
.fab-ext svg{width:20px;height:20px;fill:currentColor;}
.kbd{font-size:11px; color:var(--on-surf-var); border:1px solid var(--outline-var); border-radius:4px; padding:1px 5px;}
</style>
</head>
<body>

<header class="appbar" id="appbar">
  <div class="appbar-inner">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.96 7.96 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>

    </div>

</header>

<main class="layout">
  <!-- 配置面板 -->
  <section class="panel">
    <div class="panel-head"><h2>抽取设置</h2><div class="spacer"></div><span class="chip-static" id="remainChip"></span></div>

      <div id="params"></div>
      <label class="switch-row" id="manualRow" style="margin-top:18px">
        <span class="switch"><input type="checkbox" id="manualStop"><span class="track"></span><span class="thumb"></span></span>
        <span>
          <span class="txt">手动停止</span>
          <span class="desc">抽取后结果持续滚动，再按一次抽取按钮即停止揭晓</span>
        </span>
      </label>
      <label class="switch-row" id="confettiRow">
        <span class="switch"><input type="checkbox" id="confettiOn" checked><span class="track"></span><span class="thumb"></span></span>
        <span>
          <span class="txt">中奖礼花</span>
          <span class="desc">结果定格时喷出彩色纸片；设备性能不足、觉得卡顿时可关闭</span>
        </span>
      </label>
      <div class="actions">
        <button class="fab-ext" id="drawBtn">
          <svg viewBox="0 0 24 24"><path d="M18 4l-4 4h3v4h2V8h3l-4-4zM6 20l4-4H7v-4H5v4H2l4 4zm4-9h4v2h-4v-2zm0-4h4v2h-4V7zm0 8h4v2h-4v-2z"/></svg>
          开始抽取
        </button>
        <button class="btn btn-tonal" id="resetBtn" title="清除当前模板的已抽取记录">重置已抽</button>
      </div>
      <p style="margin-top:10px;font-size:11.5px;color:var(--on-surf-var)">快捷键：<span class="kbd">Ctrl / ⌘ + Enter</span> 抽取 · 滚动时按此键即停止</p>
    </div>
  </section>

  <!-- 结果面板 -->
  <section class="panel">
    <div class="panel-head">
      <h2>抽取结果</h2>
      <div class="spacer"></div>
      <span class="chip-static" id="counter">尚未抽取</span>
      <button class="btn btn-text" id="copyBtn">
        <svg viewBox="0 0 24 24"><path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"/></svg>复制
      </button>
      <button class="btn btn-text" id="exportBtn">
        <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>导出 CSV
      </button>
    </div>
    <div id="stage" class="stage">
      <div class="empty">
        <svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 3h2v2h-2V6zm0 4h2v6h-2v-6z"/></svg>
        <b>还没有抽取结果</b>
        选择左侧模板 → 设置参数 → 点击「开始抽取」
      </div>
    </div>
    <div class="seat-wrap" id="seatWrap">
      <div class="screen"></div>
      <div class="seat-legend">
        <span><i style="background:var(--s-c-highest);border:1px solid var(--outline-var)"></i>可选</span>
        <span><i style="background:var(--primary)"></i>本次中奖</span>
        <span><i class="i-drawn"></i>历史已抽</span>
      </div>
      <div class="seatmap" id="seatmap"></div>
    </div>
  </section>
</main>

<section class="hist-wrap">
  <div class="panel">
    <div class="panel-head">
      <h2>抽取历史</h2><div class="spacer"></div>
      <button class="btn btn-text" id="clearHist">清空历史</button>
    </div>
    <div class="hist" id="hist"><div class="hist-empty">暂无记录</div></div>
  </div>
</section>

<canvas id="confetti" aria-hidden="true"></canvas>
<div class="snackbar" id="snack"><span id="snackText"></span><b id="snackAction"></b></div>
<input type="file" id="fileInput" accept=".csv,.txt,.tsv,.json,.xlsx,.xls" hidden />

<script>
/* ==================================================================

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* 明细里的网址渲染成可点击链接（如 B 站中奖者的个人主页） */
const linkify = s => esc(s).replace(/(https?:\/\/[^\s　|"']+)/g, m => `<a class="lnk" href="${m}" target="_blank" rel="noopener">${m}</a>`);

  emp:'<svg viewBox="0 0 24 24"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>',
  group:'<svg viewBox="0 0 24 24"><path d="M16 11a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm-8 0a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5C15 14.17 10.33 13 8 13zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>',
  weight:'<svg viewBox="0 0 24 24"><path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/></svg>',
  bili:'<svg viewBox="0 0 24 24"><path d="M18.2 2.1c-.8-.5-1.9-.3-2.4.4L14 5H7.5C5.6 5 4 6.6 4 8.5v8C4 18.4 5.6 20 7.5 20h9c1.9 0 3.5-1.6 3.5-3.5v-8c0-.5-.1-1-.3-1.4l1.9-2.6c.5-.7.3-1.7-.4-2.2l-3-.2zM7.5 7h9c.8 0 1.5.7 1.5 1.5v8c0 .8-.7 1.5-1.5 1.5h-9c-.8 0-1.5-.7-1.5-1.5v-8C6 7.7 6.7 7 7.5 7zm1.5 2v2H7V9h2zm6 0v2h-2V9h2z"/></svg>'
};

/* ---------------- 模板定义 ---------------- */
const TEMPLATES = [
  { id:'number', name:'随机数字', icon:ICON.number,

  { id:'namelist', name:'名单抽签', icon:ICON.list,

  { id:'weight', name:'权重概率抽奖', icon:ICON.weight,

    fields:[
      {key:'items', label:'候选项与权重', type:'textarea', def:'一等奖,1\n二等奖,5\n三等奖,20\n谢谢参与,74', hint:'每行：名称,权重（权重可省略，默认 1）'},
      {key:'count', label:'抽取数量', type:'number', def:1, min:1},
      {key:'repeat', label:'允许重复中奖', type:'switch', def:false}

  { id:'bili', name:'B站评论抽奖', icon:ICON.bili,

    fields:[

      {key:'prize', label:'奖品名称', type:'textarea', def:'',
        hint:'留空则不显示。每行一个奖品，按抽取顺序依次分配；只填一个则所有中奖者都是该奖品'},
      {key:'pool', label:'抽奖范围', type:'select', def:'comment', rerender:true,

function buildField(fd){
  const wrap = document.createElement('div');
  const val = fv(fd.key);
  if(fd.type === 'switch'){
    wrap.className = 'switch-row';
    wrap.innerHTML = `
      <label class="switch"><input type="checkbox" ${val?'checked':''}><span class="track"></span><span class="thumb"></span></label>
      <div><div class="txt">${esc(fd.label)}</div><div class="desc">${esc(fd.desc||'')}</div></div>`;
    wrap.querySelector('input').onchange = e => { setFv(fd.key, e.target.checked); updateRemain(); if(S.tpl==='seat') drawSeatMap(); };
    return wrap;

  wrap.className = 'field';
  const id = 'f_' + fd.key;
  let inner = '';
  if(fd.type === 'number'){
    inner = `<div class="tf no-caret"><input type="number" id="${id}" value="${esc(val)}" ${fd.min!=null?`min="${fd.min}"`:''} ${fd.max!=null?`max="${fd.max}"`:''}></div>`;
  } else if(fd.type === 'select'){
    inner = `<div class="tf"><select id="${id}">${fd.options.map(o=>`<option value="${o[0]}" ${o[0]===val?'selected':''}>${esc(o[1])}</option>`).join('')}</select></div>`;
  } else if(fd.type === 'textarea'){
    inner = `<div class="tf no-caret"><textarea id="${id}" spellcheck="false">${esc(val)}</textarea></div>`;
  } else {
    inner = `<div class="tf no-caret"><input type="text" id="${id}" value="${esc(val)}"></div>`;
  }
  wrap.innerHTML = `<label for="${id}">${esc(fd.label)}</label>${inner}
    ${fd.hint?`<div class="hint">${esc(fd.hint)}</div>`:''}<div class="err" data-err="${fd.key}"></div>`;
  setTimeout(() => {
    const el = $('#' + id, wrap);
    if(!el) return;
    el.oninput = () => {
      setFv(fd.key, fd.type === 'number' ? (el.value === '' ? '' : Number(el.value)) : el.value);
      wrap.querySelector('.tf').classList.remove('error');
      wrap.querySelector('.err').textContent = '';

      if(S.tpl === 'bili' && fd.key === 'prize') setDrawBtnState();   // 奖品队列变了，按钮文案跟着更新
      if(fd.rerender) renderFields();           // 该字段会改变后续选项（如 B 站抽奖范围）
    };
  }, 0);
  return wrap;
}

const COL_RULES = [
  {key:'id',    words:['工号','员工号','员工编号','职工号','编号','工牌号','人员编号','员工id','empno','emp_no','staffid','id']},

  {key:'dept',  words:['部门','部门名称','所属部门','单位','中心','团队','division','department','dept','org']},
  {key:'post',  words:['岗位','职位','职务','岗位名称','职级','position','title','job']},
  {key:'phone', words:['手机','电话','手机号','联系方式','联系电话','mobile','phone','tel']},
  {key:'email', words:['邮箱','电子邮箱','邮件','email','mail']}
];
function detectColumns(headers){
  const map = {};
  headers.forEach((h, i) => {
    const t = String(h).trim().toLowerCase().replace(/\s|_|-/g, '');
    if(!t) return;
    for(const r of COL_RULES){
      if(map[r.key] != null) continue;
      if(r.words.some(w => t === w || t.includes(w))){ map[r.key] = i; break; }
    }
  });
  // 不猜工号列：识别不到就留空（否则会把第 0 列当工号，明细里显示成「工号 张三」）
  if(map.name == null) map.name = headers.length > 1 ? 1 : 0;
  return map;
}
function parseDelimited(text){
  text = String(text).replace(/^\uFEFF/, '').replace(/\r\n?/g, '\n');
  const first = text.split('\n')[0] || '';
  const cand = [',', '\t', ';', '|'];
  let delim = ',';
  let best = 0;
  cand.forEach(d => { const n = (first.split(d).length - 1); if(n > best){ best = n; delim = d; } });
  const rows = []; let row = [], cur = '', inQ = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQ){
      if(c === '"'){ if(text[i+1] === '"'){ cur += '"'; i++; } else inQ = false; }
      else cur += c;
    } else {
      if(c === '"') inQ = true;
      else if(c === delim){ row.push(cur); cur = ''; }
      else if(c === '\n'){ row.push(cur); rows.push(row); row = []; cur = ''; }
      else cur += c;
    }
  }
  if(cur !== '' || row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r => r.some(c => String(c).trim() !== ''));
}
function loadRows(rows){
  if(!rows || rows.length < 2){ toast('未能解析出有效数据，请检查文件/内容'); return; }
  // 表头去重：同名列会让后面的列覆盖前面的（对象键冲突），加序号后缀保住每一列
  const usedH = new Map();
  const headers = rows[0].map((h, i) => {
    let n = String(h).trim() || ('列' + (i + 1));
    if(usedH.has(n)){ const c = usedH.get(n) + 1; usedH.set(n, c); n = n + ' ' + c; } else usedH.set(n, 1);
    return n;
  });
  const data = rows.slice(1).map(r => { const o = {}; headers.forEach((h, i) => o[h] = String(r[i] ?? '').trim()); return o; })
                 .filter(o => Object.values(o).some(v => v !== ''));
  if(!data.length){ toast('数据为空'); return; }
  S.emp = { headers, rows: data, map: detectColumns(headers) };
  renderEmployeeExtra($('#params'));
  toast(`已导入 ${data.length} 条记录，识别到 ${headers.length} 个字段`);
}

function handleFile(f){
  if(!f) return;
  const name = f.name.toLowerCase();
  if(/\.xlsx?$/.test(name)){
    loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js').then(() => {
      const fr = new FileReader();
      fr.onload = ev => {
        try{
          const wb = XLSX.read(new Uint8Array(ev.target.result), {type:'array'});
          const ws = wb.Sheets[wb.SheetNames[0]];
          loadRows(XLSX.utils.sheet_to_json(ws, {header:1, defval:''}));
        }catch(err){ toast('Excel 解析失败，请另存为 CSV 后重试'); }
      };
      fr.readAsArrayBuffer(f);
    }).catch(() => toast('离线环境无法解析 .xlsx，请将文件另存为 CSV 后导入'));
    return;
  }
  const fr = new FileReader();
  fr.onload = ev => {
    try{
      if(/\.json$/.test(name)){
        const j = JSON.parse(ev.target.result);
        const arr = Array.isArray(j) ? j : (j.data || j.rows || j.list);
        if(!Array.isArray(arr) || !arr.length) return toast('JSON 需为对象数组');
        loadRows([Object.keys(arr[0]), ...arr.map(o => Object.keys(arr[0]).map(k => o[k]))]);
      } else {
        loadRows(parseDelimited(ev.target.result));
      }
    }catch(err){ toast('解析失败：' + err.message); }
  };
  fr.readAsText(f, 'UTF-8');
}
function loadScript(src){
  return new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej;
    document.head.appendChild(s); setTimeout(rej, 8000);
  });
}

/* ---------------- 池子构建 ---------------- */
function buildPool(){
  const t = S.tpl, f = S.f[t] || {};
  if(t === 'number'){
    let min = Number(f.min), max = Number(f.max);
    if(!isFinite(min) || !isFinite(max)){ fieldErr('min','请输入有效数字'); return null; }
    if(min > max) [min, max] = [max, min];
    const dec = Math.max(0, Math.min(6, Number(f.dec) || 0));
    if(dec > 0) return {items:null, numeric:{min,max,dec}, label:'个数字'};
    const total = max - min + 1;
    const arr = [];
    // 必须带 k：否则「跨次不重复」会把整个池判成已抽过（x.k 为 undefined）
    for(let i = min; i <= max; i++) arr.push({ v:i, k:'num:' + i });
    return {items:arr, label:'个数字', numeric:{min,max,dec}};
  }
  if(t === 'seat'){
    const rows = Math.max(1, Number(f.rows) || 1), cols = Math.max(1, Number(f.cols) || 1);
    const rs = Number(f.rowStart) || 1, ss = Number(f.seatStart) || 1;
    const arr = [];
    for(let r = 0; r < rows; r++) for(let c = 0; c < cols; c++) arr.push({r: rs + r, c: ss + c, k:(rs+r) + '-' + (ss+c)});
    return {items:arr, label:'个座位'};
  }
  if(t === 'namelist'){
    // k 用「名字」而不是索引：否则换一份名单后，位置相同的名字会被误判成已抽过
    const arr = splitLines(f.names).map((n,i) => ({name:n, i:i+1, k:'n:' + n}));
    return {items:arr, label:'人'};
  }
  if(t === 'employee'){
    if(!S.emp) return null;
    const m = S.emp.map, hs = S.emp.headers;
    const deptCol = m.dept != null ? hs[m.dept] : null;
    const sel = (f.depts && f.depts.length) ? f.depts : null;
    const arr = S.emp.rows.filter(r => !deptCol || !sel || sel.includes(r[deptCol]));
    // k 用「工号/姓名」而不是行号：重新导入或换表后，行号相同的人会被误判成已中奖
    return {items:arr.map((r,i) => ({row:r,
      k:'e:' + ((m.id != null ? r[hs[m.id]] : '') || (m.name != null ? r[hs[m.name]] : '') || i)})), label:'名员工'};
  }
  if(t === 'bili'){
    const b = S.bili, mode = f.pool || 'comment';
    const kw = String(f.keyword || '').trim().split(/\s+/).filter(Boolean);
    const minLen = Number(f.minLen) || 0;
    const upMid = b.meta ? String(b.meta.upMid || '') : '';
    let list = [];
    if(mode === 'comment' || mode === 'both'){
      let arr = (b.comments || []).filter(c => {
        if(f.skipUp && upMid && String(c.mid) === upMid) return false;
        if(minLen && (c.msg || '').length < minLen) return false;
        if(kw.length && !kw.some(k => (c.msg || '').includes(k))) return false;
        return true;
      });
      if(f.once !== false){                       // 每人只算一次
        const seen = new Set();
        arr = arr.filter(c => { const k = String(c.mid || c.uname); if(seen.has(k)) return false; seen.add(k); return true; });
      }
      list = list.concat(arr);
    }
    if(mode === 'share' || mode === 'both') list = list.concat(parseShareList(f.shares));
    if(!list.length) return null;
    list = list.map((x, i) => Object.assign({}, x, { k:(x.from === 'share' ? 's' : 'c') + ':' + (x.mid || '') + ':' + (x.uname || i) }));
    return {items:list, label:'位用户'};
  }
  if(t === 'weight'){
    const arr = [];
    String(f.items || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach((line, i) => {
      const p = line.split(/[,，\t=]/).map(s => s.trim()).filter(Boolean);
      if(!p.length) return;
      const w = parseFloat(p[1]);
      // 权重 0 = 永不中奖（保留 0）；负数/非法值才回退为 1
      arr.push({name: p[0], w: isFinite(w) && w >= 0 ? w : 1, k:'w:' + p[0]});   // 同上，按名称而非行号
    });
    if(!arr.length) return null;
    return {items:arr, label:'个奖项', weighted:true};
  }
  return null;
}
function splitLines(txt){
  return String(txt || '').split(/\r?\n|,|，|;|；|\t/).map(s => s.trim()).filter(Boolean);
}
function updateRemain(){
  const chip = $('#remainChip');
  if(S.tpl === 'group'){ chip.textContent = ''; return; }
  const p = buildPool();
  if(!p){ chip.textContent = S.tpl === 'employee' ? '请先导入数据' : ''; return; }
  const used = fv('exclude') ? drawnSet().size : 0;
  // 小数数字池是「无限池」（items 为 null），不能做减法，否则显示 "剩余 Infinity / 共 Infinity"
  if(!p.items){ chip.textContent = fv('exclude') ? `候选 不限 · 已排除 ${used}` : '候选 不限'; return; }
  const total = p.items.length;
  const left = Math.max(0, total - used);
  chip.textContent = (fv('exclude') ? `剩余 ${left} / 共 ${total}` : `候选 ${total}`);
}

/* ---------------- 抽取 ---------------- */
function pickN(pool, n, unique, excludeSet, weighted){
  const out = [];
  if(weighted){
    let items = excludeSet ? pool.filter(x => !excludeSet.has(x.k)) : pool.slice();
    if(!items.length) return out;
    for(let i = 0; i < n; i++){
      const total = items.reduce((s,x) => s + x.w, 0);
      let r = Math.random() * total, hit = items[items.length-1];
      for(const x of items){ r -= x.w; if(r <= 0){ hit = x; break; } }
      out.push(hit);
      if(unique) items = items.filter(x => x !== hit);
      if(!items.length) break;
    }
    return out;
  }
  let src = pool.slice();
  if(excludeSet) src = src.filter(x => !excludeSet.has(x.k));
  if(unique){
    for(let i = src.length - 1; i > 0; i--){ const j = rnd(i + 1); [src[i], src[j]] = [src[j], src[i]]; }
    return src.slice(0, n);
  }
  for(let i = 0; i < n; i++) out.push(src.length ? src[rnd(src.length)] : null);
  return out.filter(Boolean);
}

function doDraw(){
  const t = S.tpl;
  if(t === 'group') return drawGroups();
  const f = S.f[t] || {};
  const count = Math.max(1, Number(f.count) || 1);
  const pool = buildPool();
  if(!pool){
    toast(t === 'employee' ? '请先导入员工数据'
        : t === 'bili' ? '请先拉取评论或导入转发名单'
        : '请先完成参数设置');
    return;
  }

  const exclude = !!f.exclude;
  const set = exclude ? drawnSet() : null;

  /* --- 数值型（支持小数，可能无限池） --- */
  if(pool.numeric && pool.numeric.dec > 0){
    const {min,max,dec} = pool.numeric;
    let picks = [], guard = 0;
    while(picks.length < count && guard++ < count * 500){
      const v = +(min + Math.random() * (max - min)).toFixed(dec);
      if(f.unique && picks.includes(v)) continue;
      if(set && set.has(String(v))) continue;
      picks.push(v);
    }
    if(!picks.length){ toast('可选范围不足，请调整参数或重置已抽记录'); return; }
    if(f.sort) picks.sort((a,b) => a - b);
    picks.forEach(v => set && set.add(String(v)));
    // 用 toFixed 展示：否则 2.00 会被 Number 吃掉末尾的 0 显示成 "2"，与 1.77 位数不一致
    return present(picks.map(v => ({main:v.toFixed(dec), sub:'随机数字', _k:String(v)})));
  }

  const items = pool.items || [];
  if(!items.length){ toast('候选池为空，请检查参数'); return; }
  const avail = set ? items.filter(x => !set.has(x.k)) : items;
  if(!avail.length){ toast('所有候选项都已抽完，请点击「重置已抽」', '立即重置', () => { S.drawn[t] = new Set(); updateRemain(); }); return; }
  const unique = t === 'weight' ? !f.repeat : (f.unique !== false);
  if(unique && count > avail.length){
    toast(`最多只能不重复抽取 ${avail.length} 个，已按上限抽取`, '知道了');
  }
  const picks = pickN(items, count, unique, set, !!pool.weighted);
  if(!picks.length){ toast('没有可抽取的候选项'); return; }
  picks.forEach(x => set && set.add(x.k));

  let results;
  if(t === 'number'){
    results = picks.map(p => ({main:String(p.v != null ? p.v : p), sub:'随机数字', _k:String(p.v != null ? p.v : p)}));
    if(f.sort) results.sort((a,b) => Number(a.main) - Number(b.main));
  } else if(t === 'seat'){
    const alpha = f.label === 'alpha';
    // 排数超过 26 时字母用尽，回退成数字，避免出现 [ \ ] 等怪字符
    const rl = r => (alpha && r >= 1 && r <= 26) ? String.fromCharCode(64 + r) : r;
    results = picks.map(s => ({
      main: `${rl(s.r)} 排 ${s.c} 号`,
      sub: `第 ${s.r} 排 · 第 ${s.c} 号`,
      _k: s.k, _seat:s
    }));
  } else if(t === 'namelist'){
    results = picks.map(p => ({main:p.name, sub: f.showIndex ? `名单第 ${p.i} 位` : '', _k:p.k}));
  } else if(t === 'bili'){
    results = picks.map(biliResult);
  } else if(t === 'employee'){
    const m = S.emp.map, hs = S.emp.headers;
    results = picks.map(p => {
      const g = k => (m[k] != null ? p.row[hs[m[k]]] : '') || '';
      const id = g('id'), name = g('name') || '（未识别姓名）', dept = g('dept'), post = g('post');
      const sub = [dept, post].filter(Boolean).join(' · ') + (id ? ` · 工号 ${id}` : '');
      const meta = S.emp.headers.map(h => `${h}：${p.row[h] || '-'}`).join('　|　');
      return {main:name, sub:sub.replace(/^ · /,''), meta, _k:p.k};
    });
  } else if(t === 'weight'){
    results = picks.map(p => ({main:p.name, sub:`权重 ${p.w}`, _k:p.k}));
  }
  present(results);
}

function drawGroups(){
  const f = S.f.group || {};
  const want = Math.max(1, Number(f.groups) || 1);
  const names = splitLines(f.names);
  if(!names.length){ toast('请先填写成员名单'); return; }
  // 组数不能超过人数，否则会出现「0 人」的空组
  const groups = Math.min(want, names.length);
  if(want > names.length) toast(`只有 ${names.length} 人，已按 ${groups} 组分配`);
  for(let i = names.length - 1; i > 0; i--){ const j = rnd(i + 1); [names[i], names[j]] = [names[j], names[i]]; }
  const gs = Array.from({length:groups}, () => []);
  if(f.even === false){
    // 不均分：先给每组兜底 1 人，剩下的再随机撒 —— 否则会出现空组
    names.forEach((n, i) => (i < groups ? gs[i] : gs[rnd(groups)]).push(n));
  }else{
    names.forEach((n, i) => gs[i % groups].push(n));
  }
  const prefix = f.prefix || '第';
  const results = gs.map((m, i) => ({kind:'group', title:`${prefix} ${i+1} 组`, sub:`${m.length} 人`, members:m}));
  present(results);
}

/* 奖品队列：文本框里一行一个奖品，抽完即消耗，下一次自动轮到后面的 */
function biliPrizeLines(){
  if(S.tpl !== 'bili') return [];
  // 奖品名可能自带逗号/顿号，只能按「行」拆，不能用 splitLines（它会把逗号也当分隔符）
  return String((S.f.bili || {}).prize || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
}
/* 本次抽取后消耗奖品：移除前 n 行并同步文本框；n 超过奖品数时只清掉现有的 */
function consumePrize(n){
  const lines = biliPrizeLines();
  if(!lines.length) return;
  // 只填 1 个奖品 = 固定奖品（所有中奖者都是它），保持常驻不消耗
  if(lines.length === 1) return;
  const used = Math.max(0, Math.min(n, lines.length));
  const gone = lines.slice(0, used), rest = lines.slice(used);
  setFv('prize', rest.join('\n'));
  const ta = $('#f_prize');
  if(ta) ta.value = rest.join('\n');
  toast(rest.length
    ? `已发出：${gone.join('、')} → 下一个奖品：${rest[0]}`
    : `已发出：${gone.join('、')}，奖品已全部抽完`);
  setDrawBtnState();
}
/* 分配给第 i 位中奖者的奖品；奖品数少于中奖数时沿用最后一个 */
function biliPrizeAt(i){
  const l = biliPrizeLines();
  if(!l.length) return '';
  return l[i] != null && l[i] !== '' ? l[i] : l[l.length - 1];
}
function biliResult(p, i){
  const uid = String(p.mid || '');
  const isUid = /^\d{3,12}$/.test(uid);
  const link = isUid ? `https://space.bilibili.com/${uid}` : '';
  const name = p.uname || (isUid ? 'UID ' + uid : '（未知用户）');
  const msg = (p.msg || '').replace(/\s+/g, ' ').trim();
  const src = p.from === 'share' ? '转发用户' : '评论用户';
  const prize = biliPrizeAt(i || 0);
  const sub = [src, isUid ? 'UID ' + uid : ''].filter(Boolean).join(' · ');
  const meta = ['来源：' + (p.from === 'share' ? '手动导入的转发名单' : '评论区'), '昵称：' + name]
    .concat(isUid ? ['UID：' + uid, '主页：' + link] : [])
    .concat(msg ? ['评论：' + msg] : []).join('　|　');
  return { main:name, sub, meta, prize:prize || '', _k:p.k,
    _bili:{ uid:isUid ? uid : '', name, msg, src, link, prize:prize || '' } };
}

/* ---------------- 结果展示 ---------------- */
let roll = null;   // 手动停止模式下正在滚动的一批卡片
let drawToken = 0; // 防止连续抽取时上一轮延时继续定格/写历史
function present(results){
  S.last = results;
  const stage = $('#stage');
  stage.className = 'stage' + (results.length === 1 && results[0].kind !== 'group' ? ' single' : '');
  const single = S.tpl === 'seat';
  $('#seatWrap').classList.toggle('show', false);

  stage.innerHTML = results.map((r, i) => {
    if(r.kind === 'group'){
      return `<div class="gcard rolling" data-i="${i}"><h3>${esc(r.title)} · ${r.sub}</h3>
        <div class="members"><span class="m dim">分组中…</span></div></div>`;
    }
    return `<div class="rcard win rolling" data-i="${i}">
      <div class="idx">${results.length>1 ? '#'+(i+1) : ''}</div>
      ${r.prize ? `<div class="prize">${esc(r.prize)}</div>` : ''}
      <div class="main"><span class="mv cur">?</span><span class="mv nxt"></span></div>
      <div class="sub"><span class="mv cur">抽取中…</span><span class="mv nxt"></span></div>
      ${r.meta?`<div class="meta-wrap"><div class="meta"><div class="mi">${linkify(r.meta)}</div></div></div>`:''}
    </div>`;
  }).join('');

  $('#counter').textContent = `本次 ${results.length} 个结果`;

  // 滚动动画：先快速闪动占位，再定格
  const myToken = ++drawToken;
  const cards = $$('.rcard, .gcard', stage);
  const flickerPool = buildFlickerPool();
  const groupPool = results.some(r => r.kind === 'group') ? results.flatMap(r => r.members || []).filter(Boolean) : [];
  const startFlicker = card => {
    if(card.classList.contains('gcard')){
      const box = $('.members', card);
      if(!box) return setInterval(() => {}, 70);
      let span = box.querySelector('.m');
      if(!span){ span = document.createElement('span'); span.className = 'm'; box.innerHTML = ''; box.appendChild(span); }
      span.classList.remove('dim');          // 占位虚框 → 实心成员芯片
      let gLast = '';
      return setInterval(() => {
        if(!groupPool.length) return;
        for(let k = 0; k < 5; k++){                            // 同上，避免连续两帧同一个人
          const s = groupPool[rnd(groupPool.length)];
          if(s !== gLast){ gLast = s; span.textContent = s; return; }
        }
        span.textContent = gLast;
      }, 70);                                // 仅改文本，避免每帧重建 innerHTML 造成重排卡顿
    }
    const main = $('.main .cur', card) || $('.main', card);   // 只滚动当前层，另一层留给揭晓动画
    if(!main) return setInterval(() => {}, 70);
    return setInterval(() => {
      if(flickerPool.size) main.textContent = flickerPool.pick();
    }, 70);
  };

  if(S.manualStop && cards.length){
    // 手动停止：持续滚动，直到再次点击抽取按钮
    roll = { results, cards, ivs: cards.map(startFlicker) };
    showRollingBar();                    // chip 上显示「正在抽取中…· 再按一次停止」
    setDrawBtnState();
    return;
  }

  cards.forEach((card, i) => {
    const iv = startFlicker(card);
    setTimeout(() => {
      clearInterval(iv);
      if(myToken !== drawToken) return;    // 已有新一轮抽取，丢弃本轮
      settle(card, results[i], i === cards.length - 1 ? () => afterPresent(results) : null);
    }, 620);                                // 所有卡片同帧定格，多组结果同时揭晓
  });
  if(!cards.length) afterPresent(results);
}

/* 文本交叉替换：旧值在 .cur 层上移淡出，新值在 .nxt 层同时上移淡入，
   两层叠加使画面全程有内容，不会出现「空白一瞬 → 数字冒出来」的闪现感。
   动画结束后把新值写回 .cur 并清空 .nxt，视觉无跳变。
   拆成 prep（写 DOM）/ fire（加动画类）两阶段，中间只做一次 reflow：
   多个元素同帧切换时各自 offsetWidth 强排会连续冻结布局，是「卡一下」的元凶。 */
const SWAP_MS = 440;                  // 略长于 mvIn(420ms)，确保收尾在动画结束后
function swapPrep(box, text){
  if(!box) return null;
  const cur = box.querySelector && box.querySelector('.mv.cur');
  const nxt = box.querySelector && box.querySelector('.mv.nxt');
  const val = text == null ? '' : String(text);
  if(!cur || !nxt){ box.textContent = val; return null; }
  if(cur.textContent === val && !cur.classList.contains('out')) return null;
  cur.classList.remove('out'); nxt.classList.remove('in');
  nxt.textContent = val;
  return { cur, nxt, val };
}
function swapFire(box, st){
  if(!box || !st) return;
  st.cur.classList.add('out'); st.nxt.classList.add('in');
  clearTimeout(box._swapT);
  box._swapT = setTimeout(() => {
    st.cur.textContent = st.val; st.cur.classList.remove('out');
    st.nxt.textContent = ''; st.nxt.classList.remove('in');
  }, SWAP_MS);
}
/* 单元素独立调用（维持旧接口语义）：prep → reflow → fire */
function swapText(box, text){
  const st = swapPrep(box, text);
  if(!st) return;
  void box.offsetWidth;
  swapFire(box, st);
}

/* 定格某个结果卡片：主文本与副标题同时做交叉过渡，礼花与结果同步 */
function settle(card, r, done){
  card.classList.remove('rolling');
  if(r.kind === 'group'){
    const membersEl = $('.members', card);
    if(membersEl) membersEl.innerHTML = (r.members || []).map(m => `<span class="m">${esc(m)}</span>`).join('');
    card.classList.add('settled');
    done && done();
    return;
  }
  const sub = $('.sub', card), main = $('.main', card);
  if(sub) sub.title = r.sub || '';
  // 先写完所有 DOM，再一次 reflow、统一启动动画 —— 一帧只冻结布局一次
  const sa = main ? swapPrep(main, r.main) : null;
  const sb = sub ? swapPrep(sub, r.sub || '') : null;
  card.classList.add('settled');
  void card.offsetWidth;
  swapFire(main, sa); swapFire(sub, sb);
  // 中奖礼花：等数字基本浮现（mvIn 40% ≈ 170ms）再喷，既避开揭晓启动帧，观感也是「数字落定后炸开」
  setTimeout(() => {
    const c = cfCenter(card);
    if(c) cfBurst(c.x, c.y, S.last.length === 1 ? 56 : 20);
  }, 170);
  done && done();
}

/* 抽取按钮：抽取中变为「停止并揭晓」，再按一次即停止 */
const ICON_DRAW = '<svg viewBox="0 0 24 24"><path d="M18 4l-4 4h3v4h2V8h3l-4-4zM6 20l4-4H7v-4H5v4H2l4 4zm4-9h4v2h-4v-2zm0-4h4v2h-4V7zm0 8h4v2h-4v-2z"/></svg>';
const ICON_STOP = '<svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg>';
function setDrawBtnState(){
  const btn = $('#drawBtn');

  if(roll) label = '停止并揭晓';
  else if(lines.length) label = lines.length > 1 ? `抽取「${lines[0]}」· 余 ${lines.length - 1}` : `抽取「${lines[0]}」`;
  btn.innerHTML = (roll ? ICON_STOP : ICON_DRAW) + label;

/* 手动停止滚动并逐个揭晓 */
/* 滚动中状态：写在面板头部的计数 chip 上（不占布局，切换零成本） */
function showRollingBar(){

  if(!c) return;

}
function hideRollingBar(){

function stopRoll(){

  cards.forEach((card, i) => {
    setTimeout(() => {
      clearInterval(ivs[i]);
      settle(card, results[i], i === cards.length - 1 ? () => afterPresent(results) : null);
    }, 40);                                 // 所有卡片同帧定格，多组结果同时揭晓
  });
}
/* 切换模板等场景下直接取消滚动（不揭晓） */
function cancelRoll(){
  if(!roll) return;
  roll.ivs.forEach(clearInterval);
  roll = null;
  hideRollingBar();
  setDrawBtnState();
}
/* 池内单项 → 滚动时展示的文本 */
function displayName(x){
  if(x == null) return '?';
  if(x.name) return x.name;
  if(x.uname) return x.uname;                                   // B站评论池：昵称
  if(x.v != null) return String(x.v);                            // 数字池：{v, k}
  if(x.row){ const hs = S.emp.headers, m = S.emp.map; return m.name != null ? (x.row[hs[m.name]] || '?') : '?'; }
  if(x.r != null && x.c != null) return x.r + ' 排 ' + x.c + ' 号';   // 座位：须先于 c 判断
  if(x.c != null) return x.c + ' 号';
  return String(x);
}
/* 滚动展示源：返回 {size, pick()}
   旧实现是 p.items.slice(0, 60) —— 只取前 60 个反复循环，肉眼能看出在重复。
   现在改为「全量随机取样」：每次随机挑一个参与者、现算展示名，
   不做全量 map（十几万条评论也是零预处理开销），并避免连续两帧重样。 */
function buildFlickerPool(){
  const p = buildPool();
  if(!p) return { size:0, pick:() => '?' };
  if(p.items && p.items.length){
    const items = p.items;
    let last = '';
    return { size: items.length, pick(){
      for(let k = 0; k < 5; k++){                               // 最多试 5 次，避免与上一位重复
        const s = displayName(items[rnd(items.length)]);
        if(s && s !== last){ last = s; return s; }
      }
      return last || '?';
    }};
  }
  if(p.numeric){                                                // 数字池：每帧现算，不再循环固定 20 个
    const min = p.numeric.min, max = p.numeric.max, dec = p.numeric.dec || 0;
    const gen = () => (min + Math.random() * (max - min)).toFixed(dec);
    let last = '';
    return { size: 0, pick(){
      for(let k = 0; k < 5; k++){ const s = gen(); if(s !== last){ last = s; return s; } }
      return gen();
    }};
  }
  return { size:0, pick:() => '?' };
}
function afterPresent(results){
  if(S.tpl === 'seat') drawSeatMap();
  updateRemain();
  // 奖品队列：本次抽取完成后消耗掉已发出的奖品，按钮自动切到下一个
  if(S.tpl === 'bili') consumePrize(results.length);
  // 分组结果没有逐张定格，统一在结果区上方放一次礼花
  if(results[0] && results[0].kind === 'group'){
    const st = $('#stage');
    if(st && typeof st.getBoundingClientRect === 'function'){
      const r = st.getBoundingClientRect();
      cfBurst(r.left + r.width / 2, r.top + Math.min(150, r.height / 2), 56);
    }
  }
  // 历史
  const t = cur();
  S.history.unshift({
    time: new Date().toTimeString().slice(0,8),
    tpl: t.name,
    n: results.length,
    val: results.map(r => r.kind === 'group' ? `${r.title}(${r.members.length}人)`
      : (r.prize ? `${r.main}（${r.prize}）` : r.main)).join('、')
  });
  S.history = S.history.slice(0, 30);
  // 历史列表重建 DOM 有成本，延后一拍执行，别和揭晓动画抢同一帧（数据已先落盘，不丢）
  setTimeout(renderHist, 150);
}

function drawSeatMap(){
  if(S.tpl !== 'seat') return;
  const f = S.f.seat || {};
  const rows = Math.max(1, Number(f.rows) || 1), cols = Math.max(1, Number(f.cols) || 1);
  const rs = Number(f.rowStart) || 1, ss = Number(f.seatStart) || 1;
  const alpha = f.label === 'alpha';
  const set = fv('exclude') ? drawnSet() : new Set();
  const win = new Set((S.last || []).filter(r => r._seat).map(r => r._seat.k));
  // 排数超过 26 时字母用尽，回退成数字，避免出现 [ \ ] 等怪字符（与结果卡保持一致）
  const rl = r => (alpha && r >= 1 && r <= 26) ? String.fromCharCode(64 + r) : String(r);
  if(rows * cols > 900){ $('#seatWrap').classList.add('show'); $('#seatmap').innerHTML = '<div class="hint">座位过多（>900），已隐藏座位图</div>'; return; }
  $('#seatmap').innerHTML = Array.from({length:rows}, (_, ri) => {
    const r = rs + ri;
    return `<div class="seat-row"><div class="rl">${esc(rl(r))}</div>${Array.from({length:cols}, (_, ci) => {
      const c = ss + ci, k = r + '-' + c;
      const isWin = win.has(k), isDrawn = set.has(k);
      const cls = isWin ? 'win' : (isDrawn ? 'drawn' : '');
      const tip = `${rl(r)} 排 ${c} 号 · ${isWin ? '本次中奖' : (isDrawn ? '已抽中' : '可选')}`;
      return `<div class="seat ${cls}" title="${esc(tip)}">${c}</div>`;
    }).join('')}</div>`;
  }).join('');
  $('#seatWrap').classList.add('show');
}

/* ---------------- 中奖礼花 ---------------- */
const cvCf = $('#confetti');
const ctxCf = (cvCf && typeof cvCf.getContext === 'function') ? cvCf.getContext('2d') : null;
let cfW = 0, cfH = 0, cfDpr = 1, cfParts = [], cfRaf = null;
function cfResize(){
  if(!ctxCf) return;
  /* 纸片是运动中的小色块，按 1x 渲染完全够看；dpr=2 时全屏画布像素多 4 倍，
     每帧 clearRect + 纹理上传是揭晓卡顿的主要来源 */
  const dpr = 1;
  cfDpr = dpr;
  cfW = cvCf.width = Math.floor(innerWidth * dpr);
  cfH = cvCf.height = Math.floor(innerHeight * dpr);
  cvCf.style.width = innerWidth + 'px';
  cvCf.style.height = innerHeight + 'px';
  ctxCf.setTransform(dpr, 0, 0, dpr, 0, 0);   // 之后全部按 CSS 像素绘制
}
addEventListener('resize', cfResize); cfResize();
const cfRnd = (a, b) => a + Math.random() * (b - a);
/* 礼花手感参数：整体放慢、范围适中、带蓄力（先向中心微收再炸开） */
const CF = {
  spMin: 2.8, spMax: 6.4,     // 初速（px/帧），越小飞得越近
  spread: 0.86,               // 扇形张角系数（相对 π），越小越集中向上
  hMul: [0.52, 1.15],         // 水平速度系数，越小左右扩散越窄
  gravity: 0.115,             // 重力，越小飘得越慢
  vMax: 1.9,                  // 下落终端速度上限（px/帧）
  drag: 0.975,                // 空气阻力，越小水平铺开越窄
  sway: 0.5,                  // 左右飘摆幅度
  decay: [0.0032, 0.0056],    // 生命周期衰减，越小存在越久（约 3.0–5.2s）
  size: [4, 9, 6, 12],        // 纸片 w 下限/上限、h 下限/上限
  charge: [9, 14],            // 蓄力帧数（约 0.15–0.23s）：先向里收
  chargeR: [24, 56],          // 蓄力起始半径：纸片从中心外围多远处被"吸"进来，越大吸入感越强
  chargeScale: 0.34           // 蓄力起始缩放，收拢时逐渐放大到 1（越小对比越强）
};
function cfBurst(x, y, count){
  if(!ctxCf || !S.confetti) return;
  if(typeof matchMedia === 'function' && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const hue = cfRnd(0, 360);                       // 每次随机一个基准色相
  const pal = [hue, (hue + 45) % 360, (hue + 90) % 360, (hue + 180) % 360, (hue + 270) % 360];
  const a0 = -Math.PI * (0.5 + CF.spread / 2), a1 = -Math.PI * (0.5 - CF.spread / 2);
  for(let i = 0; i < count; i++){
    if(cfParts.length > 460) break;
    const ang = cfRnd(a0, a1);                     // 向上的扇形
    const sp = cfRnd(CF.spMin, CF.spMax);
    // 蓄力：纸片先出现在中心外围，再用 ease-in 向中心收拢，收满才炸开
    const bAng = cfRnd(0, Math.PI * 2);            // 收拢前所处的方位（全周随机）
    const r0 = cfRnd(CF.chargeR[0], CF.chargeR[1]);
    cfParts.push({
      cx: x, cy: y, x, y,
      vx: Math.cos(ang) * sp * cfRnd(CF.hMul[0], CF.hMul[1]),
      vy: Math.sin(ang) * sp,
      bx: Math.cos(bAng), by: Math.sin(bAng), r0,
      cdur: cfRnd(CF.charge[0], CF.charge[1]), ct: 0, charging: true,
      sc: CF.chargeScale, al: 0,
      w: cfRnd(CF.size[0], CF.size[1]), h: cfRnd(CF.size[2], CF.size[3]),
      rot: cfRnd(0, Math.PI * 2), vr: cfRnd(-.14, .14),
      sway: cfRnd(0, Math.PI * 2), swaySp: cfRnd(.02, .05),
      col: Math.random() < .62
        ? `hsl(${pal[(Math.random() * pal.length) | 0]} 92% ${cfRnd(52, 68)}%)`
        : `hsl(${(cfRnd(0, 360)) | 0} 95% ${cfRnd(55, 72)}%)`,   // 少量完全随机的点缀
      life: 1, decay: cfRnd(CF.decay[0], CF.decay[1]),
      round: Math.random() < .22
    });
  }
  if(!cfRaf) cfRaf = requestAnimationFrame(cfTick);
}
function cfTick(){
  ctxCf.setTransform(1, 0, 0, 1, 0, 0);
  ctxCf.clearRect(0, 0, cfW, cfH);
  for(let i = cfParts.length - 1; i >= 0; i--){
    const p = cfParts[i];
    if(p.charging){
      // ---- 蓄力阶段：向中心收拢（ease-in，越接近喷出越快）+ 渐显 + 放大 ----
      p.ct++;
      const t = Math.min(1, p.ct / p.cdur);
      const e = t * t;
      p.x = p.cx + p.bx * p.r0 * (1 - e);
      p.y = p.cy + p.by * p.r0 * (1 - e);
      p.sc = CF.chargeScale + (1 - CF.chargeScale) * e;
      p.al = Math.min(1, t * 1.3);
      p.rot += p.vr * 3;                 // 收拢时转得更快，卷入感更强
      if(t >= 1){ p.charging = false; p.sc = 1; p.al = 1; }
    }else{
      // ---- 喷出阶段：正常物理 ----
      p.vy += CF.gravity;                 // 重力
      if(p.vy > CF.vMax) p.vy = CF.vMax;  // 终端速度：纸片轻盈下飘，不会越掉越快
      p.vx *= CF.drag;
      p.sway += p.swaySp;
      p.x += p.vx + Math.sin(p.sway) * CF.sway;   // 纸片飘摆
      p.y += p.vy;
      p.rot += p.vr;
      p.life -= p.decay;
    }
    if(p.life <= 0 || p.y > innerHeight + 50){ cfParts.splice(i, 1); continue; }
    const alpha = Math.max(0, Math.min(1, p.life * 2.2)) * p.al;   // 后段才淡出，全程不闪
    if(alpha <= 0) continue;
    // setTransform 一次到位（替代 save/restore/translate/rotate/scale 四五次状态切换），粒子多时省不少
    // 注意画布是 dpr 缩放的：旋转缩放矩阵与坐标都要并上 cfDpr
    const cs = Math.cos(p.rot) * p.sc * cfDpr, sn = Math.sin(p.rot) * p.sc * cfDpr;
    ctxCf.setTransform(cs, sn, -sn, cs, p.x * cfDpr, p.y * cfDpr);
    ctxCf.globalAlpha = alpha;
    ctxCf.fillStyle = p.col;
    if(p.round){ ctxCf.beginPath(); ctxCf.arc(0, 0, p.w / 2, 0, Math.PI * 2); ctxCf.fill(); }
    else ctxCf.fillRect(-p.w / 2, -p.h / 2, p.w, p.h * (.45 + .55 * Math.abs(Math.cos(p.rot))));  // 翻转透视感
  }
  ctxCf.setTransform(1, 0, 0, 1, 0, 0);   // 恢复，供 clearRect 使用
  cfRaf = cfParts.length ? requestAnimationFrame(cfTick) : null;
  if(!cfRaf) ctxCf.clearRect(0, 0, cfW, cfH);
}
function cfCenter(el){
  if(!el || typeof el.getBoundingClientRect !== 'function') return null;
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
}

/* ---------------- B 站评论抽奖 ---------------- */
/* 说明：B 站接口不返回 CORS 头，浏览器无法直连，需经代理转发；
   且评论接口已启用 wbi 签名（无签名返回 -403）。这里在前端完成 MD5 + wbi 签名，
   再通过公共代理取数据；用户可在面板里换成自建代理。
   转发名单 B 站没有公开接口（无法列举转发者），只能手动导入。 */

/* --- 精简 MD5（wbi 签名需要，Web Crypto 不支持 MD5） --- */
function md5(s){
  const safe = x => (x + 0x100000000) % 0x100000000;
  let bytes = [];
  for(let i = 0; i < s.length; i++){
    const c = s.charCodeAt(i);
    if(c < 0x80) bytes.push(c);
    else if(c < 0x800) bytes.push(0xc0 | (c >> 6), 0x80 | (c & 0x3f));
    else if(c < 0xd800 || c >= 0xe000) bytes.push(0xe0 | (c >> 12), 0x80 | ((c >> 6) & 0x3f), 0x80 | (c & 0x3f));
    else { const cp = 0x10000 + (((c & 0x3ff) << 10) | (s.charCodeAt(++i) & 0x3ff)); bytes.push(0xf0 | (cp >> 18), 0x80 | ((cp >> 12) & 0x3f), 0x80 | ((cp >> 6) & 0x3f), 0x80 | (cp & 0x3f)); }
  }
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while(bytes.length % 64 !== 56) bytes.push(0);
  for(let i = 0; i < 8; i++) bytes.push(Math.floor(bitLen / Math.pow(2, i * 8)) & 0xff);   // 8 字节小端位长
  const K = [];
  for(let i = 0; i < 64; i++) K.push(Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296) >>> 0);
  const S = [7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,4,11,16,23,4,11,16,23,4,11,16,23,4,11,16,23,6,10,15,21,6,10,15,21,6,10,15,21,6,10,15,21];
  let a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476;
  for(let off = 0; off < bytes.length; off += 64){
    const M = [];
    for(let j = 0; j < 16; j++) M.push(bytes[off + j*4] | (bytes[off + j*4+1] << 8) | (bytes[off + j*4+2] << 16) | (bytes[off + j*4+3] << 24));
    let A = a0, B = b0, C = c0, D = d0;
    for(let i = 0; i < 64; i++){
      let F, g;
      if(i < 16){ F = (B & C) | (~B & D); g = i; }
      else if(i < 32){ F = (D & B) | (~D & C); g = (5 * i + 1) % 16; }
      else if(i < 48){ F = B ^ C ^ D; g = (3 * i + 5) % 16; }
      else { F = C ^ (B | ~D); g = (7 * i) % 16; }
      F = safe(F + A + K[i] + M[g]);
      A = D; D = C; C = B;
      B = safe(B + (((F << S[i]) | (F >>> (32 - S[i]))) >>> 0));
    }
    a0 = safe(a0 + A); b0 = safe(b0 + B); c0 = safe(c0 + C); d0 = safe(d0 + D);
  }
  const hex = n => n.toString(16).padStart(8, '0');
  return [a0, b0, c0, d0].map(n => hex(n).replace(/^(..)(..)(..)(..)$/, (m, x, y, z, w) => w + z + y + x)).join('');
}

const WBI_MIXIN = [46,47,18,2,53,8,23,32,15,50,10,31,58,3,45,35,27,43,5,49,33,9,42,19,29,28,14,39,12,38,41,13,37,48,7,16,24,55,40,61,26,17,0,1,60,51,30,4,22,25,54,21,56,59,6,63,57,62,11,36,20,34,44,52];
/* 公共 CORS 代理普遍不稳定（2026 现状：allorigins/codetabs 常 522、corsproxy.io 需付费 Key、
   cors.lol 常 429），仅作尽力尝试；可靠方式是用「复制抓取脚本」在视频页同源取全量。
   自建代理可在界面里填（前缀须以 url= 结尾）。 */
const BILI_PROXIES = [
  'https://api.allorigins.win/raw?url=',
  'https://api.codetabs.com/v1/proxy?quest=',
  'https://api.cors.lol/?url=',
  'https://corsproxy.io/?url='
];
function biliProxyList(){
  let custom = '';
  try{ custom = localStorage.getItem('rd-proxy') || ''; }catch(e){}
  custom = custom.trim();
  return (custom ? [custom] : []).concat(BILI_PROXIES);
}
/* 经代理取 JSON：依次尝试，第一个成功即返回 */
async function biliJSON(url){
  let lastErr = null;
  for(const p of biliProxyList()){
    try{
      const r = await fetch(p + encodeURIComponent(url), { cache:'no-store' });
      if(!r.ok) throw new Error('HTTP ' + r.status);
      const txt = (await r.text()).trim();
      const obj = JSON.parse(txt.replace(/^<\?xml[^>]*\?>/, ''));
      if(obj && typeof obj === 'object') return obj;
      throw new Error('返回格式异常');
    }catch(e){ lastErr = e; }
  }
  // 公共代理常失效，给出可行动的下一步，而不是干巴巴的「网络请求失败」
  throw new Error('代理请求失败（' + ((lastErr && lastErr.message) || '未知') + '）。公共代理大多已失效，建议点「复制抓取脚本」在视频页取全量后粘贴');
}
async function biliWbiKey(){
  if(S.bili.mixin) return S.bili.mixin;
  const nav = await biliJSON('https://api.bilibili.com/x/web-interface/nav');
  const img = (nav.data && nav.data.wbi_img && nav.data.wbi_img.img_url || '').split('/').pop().split('.')[0];
  const sub = (nav.data && nav.data.wbi_img && nav.data.wbi_img.sub_url || '').split('/').pop().split('.')[0];
  if(!img || !sub) throw new Error('获取签名密钥失败');
  const raw = img + sub;
  S.bili.mixin = WBI_MIXIN.map(i => raw[i]).join('').slice(0, 32);
  return S.bili.mixin;
}
function biliSign(params, mixin){
  const p = Object.assign({ wts: Math.round(Date.now() / 1000) }, params);
  const clean = v => String(v).replace(/[!'()*]/g, '');
  const qs = Object.keys(p).sort().map(k => encodeURIComponent(k) + '=' + encodeURIComponent(clean(p[k]))).join('&');
  return qs + '&w_rid=' + md5(qs + mixin);
}
/* 解析各种形式的链接 / BV / av / b23 短链（短链需联网跳转，走代理取 Location） */
function parseBiliInput(txt){
  const s = String(txt || '').trim();
  if(!s) return { err:'请输入视频链接或 BV 号' };
  let m = s.match(/BV[0-9A-Za-z]{10}/);
  if(m) return { bvid:m[0] };
  m = s.match(/\bav(\d+)\b/i) || s.match(/^\s*(\d{1,12})\s*$/);
  if(m) return { aid:Number(m[1]) };
  if(/b23\.tv/i.test(s)) return { short:s.match(/https?:\/\/[^\s]+/)[0] };
  return { err:'无法识别，请粘贴 BV 号、av 号或 bilibili.com 视频链接' };
}
async function biliResolve(input, onTip){
  const p = parseBiliInput(input);
  if(p.err) throw new Error(p.err);
  let url = input.trim();
  if(p.short){
    onTip && onTip('正在解析短链…');
    for(const px of biliProxyList()){
      try{
        const r = await fetch(px + encodeURIComponent(p.short), { cache:'no-store', redirect:'follow' });
        url = r.url || url;
        const mm = decodeURIComponent(url).match(/BV[0-9A-Za-z]{10}/);
        if(mm){ p.bvid = mm[0]; break; }
      }catch(e){}
    }
    if(!p.bvid) throw new Error('短链解析失败，请改用完整链接或 BV 号');
  }
  if(p.bvid){
    const v = await biliJSON('https://api.bilibili.com/x/web-interface/view?bvid=' + p.bvid);
    if(v.code !== 0) throw new Error(v.message || '视频信息获取失败');
    return { aid:v.data.aid, bvid:v.data.bvid, title:v.data.title, up:v.data.owner.name, upMid:v.data.owner.mid, reply:v.data.stat.reply };
  }
  const v = await biliJSON('https://api.bilibili.com/x/web-interface/view?aid=' + p.aid);
  if(v.code !== 0) throw new Error(v.message || '视频信息获取失败');
  return { aid:v.data.aid, bvid:v.data.bvid, title:v.data.title, up:v.data.owner.name, upMid:v.data.owner.mid, reply:v.data.stat.reply };
}
/* 注意：游标只能用接口返回的 cursor.pagination_reply.next_offset。
   用末条 rpid 自造游标会让服务端返回 -400（min_score must be <= max_score），
   pn/ps 分页也已被忽略，两者都不要再启用。 */
/* 分页拉取评论 —— 新版接口：pagination_str 游标分页（pn/ps 已被服务端忽略）
   mode:2=最新（完整列表）3=热门；匿名访问只返回约 3 条预览，完整列表需登录态，见 biliSnippet() */
async function biliFetchComments(aid, pages, onTip, withSub, cap){
  const mixin = await biliWbiKey();
  const LOCALE = JSON.stringify({ c_locale:{ language:'zh', script:'Hans' }, always_translate:false });
  const out = [];
  const all = !pages;                                 // pages 为 0 → 拉取全部
  const CAP = Number(cap) || 0;                       // 条数上限（0 = 不限）
  let offset = '', guard = 0, total = 0;
  while(true){
    if(!all && guard >= pages) break;
    if(CAP && out.length >= CAP) break;               // 达到条数上限
    onTip && onTip(all ? `正在拉取第 ${guard + 1} 页评论（已 ${out.length} 条）…` : `正在拉取第 ${guard + 1} / ${pages} 页评论…`);
    const qs = biliSign({
      oid:aid, type:1, mode:2, ps:30,                   // ps 仍生效，上限 30 → 页数减少约 1/3
      pagination_str: JSON.stringify({ offset }),
      plat:1, web_location:1315875,                   // 新版：1550101 已过时
      'x-bili-locale-json': LOCALE
    }, mixin);
    const r = await biliJSON('https://api.bilibili.com/x/v2/reply/wbi/main?' + qs);
    if(r.code !== 0) throw new Error(r.message || ('第 ' + (guard + 1) + ' 页拉取失败'));
    const reps = (r.data && r.data.replies) || [];
    const cur = (r.data && r.data.cursor) || {};
    total = cur.all_count || total;
    reps.forEach(x => {
      out.push({
        mid:x.mid,
        uname:(x.member && x.member.uname) || ('UID ' + x.mid),
        msg:((x.content && x.content.message) || '').replace(/\n/g, ' '),
        time:x.ctime, like:x.like
      });
      if(withSub && Array.isArray(x.replies)) x.replies.forEach(s => out.push({
        mid:s.mid,
        uname:(s.member && s.member.uname) || ('UID ' + s.mid),
        msg:((s.content && s.content.message) || '').replace(/\n/g, ' '),
        time:s.ctime, like:s.like, sub:true
      }));
    });
    // 只认接口返回的真实游标；拿不到就到此为止，绝不伪造（否则 -400）
    const next = (cur.pagination_reply && cur.pagination_reply.next_offset) || '';
    if(cur.is_end || !reps.length || !next || next === offset || (++guard) >= 500) break;
    offset = next;
    // 不再固定 sleep：实测连续 109 页无节流也无一报错，只在出错时由上层重试
  }
  out.total = total;      // 接口侧评论总数，用于判断是否被匿名限流
  return out;
}
/* 生成「视频页控制台抓取脚本」：同源带 Cookie、不经代理、不上传任何凭据，可拿全量评论 */
function biliSnippet(aid){
  const tpl = document.getElementById('biliSnippetTpl');
  if(!tpl) return '';
  return tpl.textContent
    .replace('__AID__', String(aid || 0))
    .replace('__MD5__', md5.toString())                    // 复用本文件已验证的 md5，避免两份实现漂移
    .replace('__MIXIN__', JSON.stringify(WBI_MIXIN));
}
/* 转发名单：支持纯文本昵称、昵称+UID、space 主页链接，每行一个 */
function parseShareList(txt){
  const out = [];
  String(txt || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean).forEach((line, i) => {
    // UID：优先 space 主页链接，其次 uid=xxx，最后是行内独立的 3–12 位数字
    let uid = (line.match(/space\.bilibili\.com\/(\d{3,12})/i) || [])[1]
           || (line.match(/uid\s*[=:：\s]\s*(\d{3,12})/i) || [])[1] || '';
    let rest = line.replace(/https?:\/\/\S+/g, ' ').replace(/uid\s*[=:：]\s*\d{3,12}/gi, ' ');
    if(!uid){
      const m2 = rest.match(/\b(\d{3,12})\b/);
      if(m2){ uid = m2[1]; rest = rest.replace(m2[1], ' '); }
    }
    let name = rest.replace(/[,，\t|]+/g, ' ').replace(/\s+/g, ' ').trim();
    if(!name) name = uid ? ('UID ' + uid) : line;
    out.push({ mid:uid || ('s' + i), uname:name, msg:'', from:'share' });
  });
  return out;
}
/* 手动粘贴接口 JSON（代理不可用时的兜底） */
function parsePastedComments(txt){
  const s = String(txt || '').trim();
  if(!s) return [];
  let obj = null;
  try{ obj = JSON.parse(s); }catch(e){ return []; }
  const reps = (obj && obj.data && obj.data.replies) || (obj && obj.replies) || (Array.isArray(obj) ? obj : null);
  if(!reps) return [];
  return reps.map(x => ({
    mid:x.mid || (x.member && x.member.mid) || '',
    uname:(x.member && x.member.uname) || x.uname || ('UID ' + (x.mid || '')),
    msg:((x.content && x.content.message) || x.msg || '').replace(/\n/g, ' '),
    time:x.ctime || 0, like:x.like || 0
  })).filter(x => x.uname);
}

/* ---------------- 本地助手：扫码登录 + 带登录态取全量评论 ---------------- */
function helperBase(){
  try{ return (localStorage.getItem('rd-helper') || '').trim() || 'http://127.0.0.1:8787'; }catch(e){ return 'http://127.0.0.1:8787'; }
}
/* 流式拉取（SSE）：边拉边推进度，失败则抛错由调用方降级到普通接口 */
function helperStream(p, onProg){
  return new Promise((resolve, reject) => {
    if(typeof EventSource === 'undefined'){ reject(new Error('no-sse')); return; }
    let es = null, done = false;
    // 超大视频（十几万条评论）全量要几分钟到十几分钟，超时放宽到 20 分钟
    const to = setTimeout(() => { if(!done){ try{ es.close(); }catch(e){} reject(new Error('拉取超时，请重试')); } }, 1200000);
    try{ es = new EventSource(helperBase() + p); }
    catch(e){ clearTimeout(to); reject(e); return; }
    es.onmessage = ev => {
      let d = null;
      try{ d = JSON.parse(ev.data); }catch(e){ return; }
      if(!d) return;
      if(d.type === 'progress'){ onProg && onProg(d); return; }
      done = true; clearTimeout(to);
      try{ es.close(); }catch(e){}
      if(d.type === 'done') resolve(d.data);
      else reject(new Error((d && d.error) || '助手拉取失败'));
    };
    es.onerror = () => {                  // 连接断开即降级，交给上层走普通接口
      if(done) return;
      done = true; clearTimeout(to);
      try{ es.close(); }catch(e){}
      reject(new Error('no-sse'));
    };
  });
}
async function helperGet(p){
  const r = await fetch(helperBase() + p, { cache:'no-store' });
  return r.json();
}
/* 视频解析：优先本地助手（公共代理已大面积失效），失败再回退代理直连 */
async function biliResolveSmart(input, onTip){
  try{
    const p = parseBiliInput(input);
    const q = p.bvid ? ('bvid=' + encodeURIComponent(p.bvid)) : (p.aid ? ('aid=' + p.aid) : '');
    if(q && !p.short){
      onTip && onTip('正在解析视频（本地助手）…');
      const j = await helperGet('/api/video?' + q);
      if(j.ok) return { aid:j.aid, bvid:j.bvid, title:j.title, up:j.up, upMid:j.upMid, reply:j.reply };
    }
  }catch(e){}
  return biliResolve(input, onTip);
}
/* 评论拉取：助手已登录 → 取全量；助手未登录 → 明确提示；助手没起 → 回退匿名代理 */
async function biliFetchSmart(aid, cap, onTip, withSub, deep){
  let h = null;
  try{ h = await helperGet('/api/health'); }catch(e){}
  if(h && h.ok){
    onTip && onTip(h && h.logged ? '正在通过本地助手拉取评论（已登录）…' : '正在通过本地助手拉取评论…');
    const t0 = Date.now();
    const q = '?aid=' + aid + (cap ? '&cap=' + cap : '') +
      (withSub === false ? '&sub=0' : '') + (deep === false ? '&deep=0' : '');
    let j = null;
    try{
      const ts0 = Date.now();
      // 优先流式：大视频能实时看到「已拉取 N 条」，不干等；不支持就自动降级
      j = await helperStream('/api/comments/stream' + q, pr => {
        const el = (Date.now() - ts0) / 1000;
        const rate = pr.got > 0 && el > 1 ? pr.got / el : 0;
        const eta = (rate && pr.total && pr.total > pr.got)
          ? ` · 预计还需 ${Math.max(1, Math.round((pr.total - pr.got) / rate))}s` : '';
        if(pr.phase === 'main'){
          const seg = (pr.blocks && pr.done) ? ` · ${pr.conc} 路并行 ${pr.done}/${pr.blocks} 分片` : '';
          onTip && onTip(`正在拉取评论…  已 ${pr.got} 条${pr.total ? ' / 约 ' + pr.total : ''}${eta}${seg}`);
        } else if(pr.phase === 'sub') onTip && onTip(`正在补拉楼中楼…  ${pr.done}/${pr.total} 个主楼（已 ${pr.got} 条）`);
      });
    }catch(e){
      onTip && onTip('正在通过本地助手拉取评论…');
      j = await helperGet('/api/comments' + q);
    }
    if(!j.ok) throw new Error(j.error || '助手拉取失败');
    return { list:(j.list || []).map(x => ({ mid:x.mid, uname:x.uname, msg:x.msg, time:x.time, like:x.like, sub:!!x.sub })),
             total:j.total || 0, warn:j.warn || '', mainCount:j.mainCount || 0, subCount:j.subCount || 0,
             subBlocked:!!j.subBlocked,
             elapsed:j.elapsed || (Date.now() - t0), cached:!!j.cached };
  }
  const t0 = Date.now();
  const list = await biliFetchComments(aid, 0, onTip, withSub, cap);   // 助手不可用时的直连兜底（通常被限流）
  return { list, total:list.total || 0, elapsed:Date.now() - t0 };
}
/* 扫码登录：取二维码 → 轮询状态 → 成功后回调 */
async function startBiliLogin(box, setTip, done){
  try{
    setTip('正在连接本地助手…');
    await helperGet('/api/health');
  }catch(e){
    setTip('未检测到本地助手', true);
    if(box) box.innerHTML = `<div class="qrbox"><div class="qrhint">
      请先在本项目目录执行：<br><code>node bili-helper.js</code><br>
      需要 Node 18+，启动后保持窗口开着，再回来点「扫码登录」。<br>
      不想启动助手，就点「复制抓取脚本」在视频页取全量。</div></div>`;
    return;
  }
  let q = null;
  try{ q = await helperGet('/api/login/qrcode'); }catch(e){}
  if(!q || !q.key){ setTip('获取二维码失败', true); return; }
  if(box) box.innerHTML = `<div class="qrbox">
      <div class="qrimg">${q.svg}</div>
      <div class="qrtip">请用 <b>B站 App</b> 扫码并确认登录<span class="dots"></span>
        <div class="qrwarn">Cookie 仅存在本机助手内存中，不写盘、不发给任何第三方</div></div>
      <button class="btn btn-outlined" id="biliQrCancel">取消</button>
    </div>`;
  const cancel = box ? $('#biliQrCancel', box) : null;
  let alive = true;
  if(cancel) cancel.onclick = () => { alive = false; if(box) box.innerHTML = ''; setTip('已取消登录'); };
  setTip('等待扫码…');
  const t0 = Date.now();
  while(alive && Date.now() - t0 < 180000){
    await new Promise(r => setTimeout(r, 1500));
    if(!alive) break;
    let s = null;
    try{ s = await helperGet('/api/login/poll?key=' + encodeURIComponent(q.key)); }catch(e){ continue; }
    if(!s) continue;
    if(s.state === 'success'){
      if(box) box.innerHTML = `<div class="qrbox"><div class="qrhint ok">已登录：<b>${esc(s.uname || 'B站用户')}</b>${s.mid ? '（UID ' + s.mid + '）' : ''}<br>现在点「拉取评论」即可取全量评论</div></div>`;
      setTip('已登录 ' + (s.uname || ''));
      toast('扫码登录成功：' + (s.uname || ''));
      done && done();
      return;
    }
    if(s.state === 'scanned') setTip('已扫码，请在手机上确认…');
    else if(s.state === 'expired'){ setTip('二维码已失效，请重新点击「扫码登录」', true); if(box) box.innerHTML = ''; return; }
  }
  if(alive){ setTip('登录超时，请重试', true); if(box) box.innerHTML = ''; }
}
