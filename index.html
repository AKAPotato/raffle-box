  const hasPrize = S.last.some(r => r.prize);          // 只有设了奖品才多一列，避免空列
  const head = isGroup ? ['组名','人数','成员']
    : (isBili ? (hasPrize ? ['序号','奖品','昵称','UID','来源','主页链接','评论内容']
                          : ['序号','昵称','UID','来源','主页链接','评论内容'])
              : ['序号','结果','说明','明细']);
  const lines = [head.join(',')];
  S.last.forEach((r, i) => {
    if(isGroup) lines.push([r.title, r.sub, r.members.join(' / ')].map(csvCell).join(','));
    else if(isBili){
      const tail = [r.main, (r._bili && r._bili.uid) || '', (r._bili && r._bili.src) || '',
        (r._bili && r._bili.link) || '', (r._bili && r._bili.msg) || ''];
      lines.push((hasPrize ? [i+1, r.prize || ''].concat(tail) : [i+1].concat(tail)).map(csvCell).join(','));
    }
    else lines.push([i+1, r.main, r.sub || '', r.meta || ''].map(csvCell).join(','));
  });
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `抽取结果_${cur().name}_${new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
  toast('已导出 CSV 文件');
};
function csvCell(v){ v = String(v ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }

/* ---------------- 动作 ---------------- */
$('#drawBtn').onclick = () => { roll ? stopRoll() : doDraw(); };   // 手动停止模式下同一按钮即停
$('#resetBtn').onclick = () => { S.drawn[S.tpl] = new Set(); updateRemain(); if(S.tpl === 'seat') drawSeatMap(); toast('已清除「' + cur().name + '」的已抽取记录'); };
addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key === 'Enter'){ e.preventDefault(); roll ? stopRoll() : doDraw(); }
});

/* 手动停止开关（记忆偏好） */
let renderToken = 0;
const manualBox = $('#manualStop');
S.manualStop = (() => { try{ return localStorage.getItem('rd-manual') === '1'; }catch(e){ return false; } })();
manualBox.checked = S.manualStop;
manualBox.onchange = () => {
  S.manualStop = manualBox.checked;
  try{ localStorage.setItem('rd-manual', S.manualStop ? '1' : '0'); }catch(e){}
  if(!S.manualStop && roll) stopRoll();
};

/* 礼花开关（默认开启，记忆偏好） */
const confettiBox = $('#confettiOn');
S.confetti = (() => { try{ return localStorage.getItem('rd-confetti-v2') !== '0'; }catch(e){ return true; } })();
if(confettiBox){
  confettiBox.checked = S.confetti;
  confettiBox.onchange = () => {
    S.confetti = confettiBox.checked;
    try{ localStorage.setItem('rd-confetti-v2', S.confetti ? '1' : '0'); }catch(e){}
    if(!S.confetti){ cfParts = []; if(ctxCf) ctxCf.clearRect(0, 0, cfW, cfH); }
  };
}

function renderAll(){
  cancelRoll();
  S.last = [];                     // 换模板即丢弃上一批结果，否则「复制/导出」会用新模板的 schema 格式化旧结果
  renderChips();
  const token = ++renderToken;              // 防止快速连点时被上一轮延时覆盖
  const body = $('#tplBody');
  body.classList.add('out');            // 淡出
  setTimeout(() => {
    if(token !== renderToken) return;
    renderFields(); body.classList.remove('out');   // 换内容后淡入
  }, 210);
  const stage = $('#stage');
  stage.classList.add('fade','out');
  setTimeout(() => {
    if(token !== renderToken) return;
    stage.className = 'stage';
    stage.innerHTML = `<div class="empty">
      <svg viewBox="0 0 24 24"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 3h2v2h-2V6zm0 4h2v6h-2v-6z"/></svg>
      <b>还没有抽取结果</b>点击「开始抽取」生成结果</div>`;
    stage.classList.remove('out');
  }, 210);
  $('#counter').textContent = '尚未抽取';
  $('#seatWrap').classList.remove('show');
  if(S.tpl === 'seat') drawSeatMap();
  setDrawBtnState();          // 切模板后刷新按钮文案（清掉/显示当前奖品）
}
renderAll();
</script>

<!-- B站评论抓取脚本模板：在视频页(www.bilibili.com)控制台运行，同源带 Cookie、不经代理、不上传凭据。
     __AID__ / __MD5__ / __MIXIN__ 由 biliSnippet() 注入。 -->
<script type="text/plain" id="biliSnippetTpl">
(async () => {
  let AID = __AID__;
  const CAP = 5000, MAXPAGE = 400;
  const md5 = __MD5__;
  const MIXIN_TAB = __MIXIN__;

  // 没传 aid 时，从当前视频页 URL 自己解析
  if (!AID) {
    const bv = (location.href.match(/BV[0-9A-Za-z]{10}/) || [])[0];
    if (!bv) { console.log('请在视频页面(www.bilibili.com/video/BV...)上运行本脚本'); return; }
    const v = await (await fetch('https://api.bilibili.com/x/web-interface/view?bvid=' + bv, { credentials: 'include' })).json();
    AID = v.data && v.data.aid;
  }
  if (!AID) { console.log('未识别到视频，请先在工具里点一次「拉取评论」再复制脚本'); return; }

  // wbi 签名密钥
  const nav = await (await fetch('https://api.bilibili.com/x/web-interface/nav', { credentials: 'include' })).json();
  const w = nav.data && nav.data.wbi_img;
  if (!w) { console.log('获取签名密钥失败，请确认已登录 B 站'); return; }
  const key = (w.img_url.split('/').pop().split('.')[0]) + (w.sub_url.split('/').pop().split('.')[0]);
  const MIXIN = MIXIN_TAB.map(i => key[i]).join('').slice(0, 32);

  const clean = v => String(v).replace(/[!'()*]/g, '');
  const sign = (p) => {
    const q = Object.assign({ wts: Math.round(Date.now() / 1000) }, p);
    const s = Object.keys(q).sort().map(k => encodeURIComponent(k) + '=' + encodeURIComponent(clean(q[k]))).join('&');
    return s + '&w_rid=' + md5(s + MIXIN);
  };
  // 游标只能用接口返回的 cursor.pagination_reply.next_offset；自造游标会 -400

  let offset = '', out = [], page = 0;
  const roots = [];                 // 有深层子回复待补拉的主楼 rpid
  const seen = new Set();           // rpid 去重，避免内嵌预览与补拉重复计入
  const addOne = (x, isSub) => {
    const k = String(x.rpid || '');
    if (k) { if (seen.has(k)) return; seen.add(k); }
    out.push({
      mid: x.mid,
      member: { uname: (x.member && x.member.uname) || '' },
      content: { message: ((x.content && x.content.message) || '').replace(/\n/g, ' ') },
      ctime: x.ctime, like: x.like, sub: !!isSub
    });
  };
  for (; page < MAXPAGE; page++) {
    const qs = sign({
      oid: AID, type: 1, mode: 2, ps: 30, plat: 1, web_location: 1315875,
      pagination_str: JSON.stringify({ offset: offset }),
      'x-bili-locale-json': JSON.stringify({ c_locale: { language: 'zh', script: 'Hans' }, always_translate: false })
    });
    const r = await (await fetch('https://api.bilibili.com/x/v2/reply/wbi/main?' + qs, { credentials: 'include' })).json();
    if (r.code !== 0) { console.log('第 ' + (page + 1) + ' 页失败：' + r.code + ' ' + r.message); break; }
    const reps = (r.data && r.data.replies) || [];
    if (!reps.length) { console.log('第 ' + (page + 1) + ' 页无数据，结束'); break; }
    const cur = (r.data && r.data.cursor) || {};
    reps.forEach(x => {
      addOne(x, false);
      // 主楼响应自带子回复预览，先全部收下：深层补拉接口可能不可用，这部分是保底
      if (Array.isArray(x.replies)) x.replies.forEach(s => addOne(s, true));
      const inline = Array.isArray(x.replies) ? x.replies.length : 0;
      if ((x.rcount || 0) > inline) roots.push(x.rpid);
    });
    console.log('第 ' + (page + 1) + ' 页 +' + reps.length + ' 条，累计 ' + out.length + (cur.all_count ? ' / 共约 ' + cur.all_count : ''));
    if (out.length >= CAP) { console.log('已达上限 ' + CAP + ' 条，停止'); break; }
    const nx = (cur.pagination_reply && cur.pagination_reply.next_offset) || '';
    if (cur.is_end || !nx || nx === offset) break;
    offset = nx;
    // 不节流：实测连翻 109 页无报错，速度约快 5 倍；失败时脚本会在上面 break 并保留已取部分
  }

  // 补拉深层楼中楼（页面内同源带 Cookie，服务端直连常被 -412；先试 1 次，不可用就跳过）
  if (roots.length) {
    const su = (rpid, pn) => 'https://api.bilibili.com/x/v2/reply/reply?oid=' + AID +
      '&type=1&root=' + rpid + '&pn=' + pn + '&ps=20';
    let probe = null;
    try { probe = await (await fetch(su(roots[0], 1), { credentials: 'include' })).json(); } catch (e) {}
    if (!probe || probe.code !== 0) {
      console.log('深层楼中楼补拉不可用（' + ((probe && probe.code) || '网络错误') +
        '），已保留主楼自带的子回复预览，不影响抽奖');
    } else {
      let got = 0;
      for (let i = 0; i < roots.length; i++) {
        for (let pn = 1; pn <= 20; pn++) {
          let r2 = (i === 0 && pn === 1) ? probe : null;
          if (!r2) { try { r2 = await (await fetch(su(roots[i], pn), { credentials: 'include' })).json(); } catch (e) { break; } }
          if (!r2 || r2.code !== 0) break;
          const rr = (r2.data && r2.data.replies) || [];
          if (!rr.length) break;
          rr.forEach(s => { const n = out.length; addOne(s, true); got += out.length - n; });
          if (rr.length < 20) break;
        }
      }
      console.log('楼中楼补拉 +' + got + ' 条');
    }
  }

  const txt = JSON.stringify({ code: 0, data: { replies: out } });
  try {
    await navigator.clipboard.writeText(txt);
    console.log('已复制 ' + out.length + ' 条到剪贴板 → 回到抽奖工具，粘贴到「网络设置与手动导入」里点「解析粘贴内容」');
  } catch (e) {
    console.log('自动复制失败，请手动复制下面这段（从 { 开始到结尾 }）：');
    console.log(txt);
  }
})();
</script>
